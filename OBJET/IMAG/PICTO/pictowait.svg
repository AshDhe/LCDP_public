  <title id="title">Chargement en cours</title>
  <style>@media (prefers-reduced-motion: reduce) { .rotation { animation: none; } } .rotation { transform-origin: 96px 96px; animation: tourner 3.36s steps(12, end) infinite; } @keyframes tourner { to { transform: rotate(360deg); } }</style>
