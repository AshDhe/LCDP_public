<div class="lcdp-box-fiche-parc" role="dialog" aria-modal="true" data-lcdp-box-fiche-parc>
  <article class="lcdp-box-fiche-parc__card">
    <button
      class="lcdp-box-fiche-parc__close"
      type="button"
      aria-label="Fermer"
      data-lcdp-fiche-parc-close
    >
      ×
    </button>

    <header class="lcdp-box-fiche-parc__header">
      <h2 class="lcdp-box-fiche-parc__title" data-lcdp-fiche-parc-title>
        Parc
      </h2>

      <div
        class="lcdp-box-fiche-parc__actions lcdp-box-fiche-parc__actions-barre lcdp-box-card-parc--reserver"
        aria-label="Actions du parc"
        data-lcdp-fiche-parc-actions
      >
        <button
          class="lcdp-button lcdp-box-card-parc__action lcdp-box-card-parc__action--vert-plein"
          type="button"
          aria-label="Afficher la présentation du parc"
          title="Afficher la présentation du parc"
          aria-current="page"
          data-lcdp-fiche-parc-action-le-parc
        >
          <img
            class="lcdp-box-card-parc__action-icone lcdp-box-card-parc__action-icone--presentation"
            src="/OBJET/IMAG/PICTO/picto-presentation.svg"
            data-site-src="/OBJET/IMAG/PICTO/picto-presentation.svg"
            alt=""
            width="28"
            height="28"
            decoding="async"
            draggable="false"
            aria-hidden="true"
            data-lcdp-fiche-parc-action-le-parc-icone
          >
          <span class="lcdp-box-card-parc__action-libelle">Le parc</span>
        </button>

        <button
          class="lcdp-button lcdp-box-card-parc__action lcdp-box-card-parc__action--vert-contour"
          type="button"
          aria-label="Partager la page du parc"
          title="Partager la page du parc"
          data-lcdp-fiche-parc-action-partager
        >
          <img
            class="lcdp-box-card-parc__action-icone lcdp-box-card-parc__action-icone--partager"
            src="/OBJET/IMAG/PICTO/picto-partager.svg"
            data-site-src="/OBJET/IMAG/PICTO/picto-partager.svg"
            alt=""
            width="28"
            height="28"
            decoding="async"
            draggable="false"
            aria-hidden="true"
            data-lcdp-fiche-parc-action-partager-icone
          >
          <span class="lcdp-box-card-parc__action-libelle">Partager</span>
        </button>

        <button
          class="lcdp-button lcdp-box-card-parc__action lcdp-box-card-parc__action--orange-contour"
          type="button"
          aria-label="Afficher le planning du parc"
          title="Afficher le planning du parc"
          data-lcdp-fiche-parc-action-planning
        >
          <img
            class="lcdp-box-card-parc__action-icone lcdp-box-card-parc__action-icone--planning"
            src="/OBJET/IMAG/PICTO/picto-planning.svg"
            data-site-src="/OBJET/IMAG/PICTO/picto-planning.svg"
            alt=""
            width="28"
            height="28"
            decoding="async"
            draggable="false"
            aria-hidden="true"
            data-lcdp-fiche-parc-action-planning-icone
          >
          <span class="lcdp-box-card-parc__action-libelle">Planning</span>
        </button>

        <button
          class="lcdp-button lcdp-box-card-parc__action lcdp-box-card-parc__action--orange-plein"
          type="button"
          aria-label="Planifier dans ce parc"
          title="Planifier dans ce parc"
          data-lcdp-fiche-parc-action-planifier
        >
          <img
            class="lcdp-box-card-parc__action-icone lcdp-box-card-parc__action-icone--reserver"
            src="/OBJET/IMAG/PICTO/picto-reserver.svg"
            data-site-src="/OBJET/IMAG/PICTO/picto-reserver.svg"
            alt=""
            width="28"
            height="28"
            decoding="async"
            draggable="false"
            aria-hidden="true"
            data-lcdp-fiche-parc-action-planifier-icone
          >
          <span class="lcdp-box-card-parc__action-libelle">Planifier</span>
        </button>
      </div>
    </header>

    <section class="lcdp-box-fiche-parc__section" aria-label="Présentation du parc">
      <h3>Présentation</h3>
      <div class="lcdp-box-fiche-parc__box-text" data-lcdp-fiche-parc-presentation>
        Présentation non renseignée.
      </div>
    </section>

    <section class="lcdp-box-fiche-parc__section lcdp-box-fiche-parc__section--galerie" aria-label="Galerie photo du parc">
      <div class="lcdp-box-fiche-parc__galerie" data-lcdp-fiche-parc-galerie-slot></div>
    </section>

    <section class="lcdp-box-fiche-parc__section lcdp-box-fiche-parc__section--map" aria-label="Carte du parc">
      <div class="lcdp-box-fiche-parc__map" data-lcdp-fiche-parc-map-slot></div>
    </section>

    <section class="lcdp-box-fiche-parc__section" aria-label="Accès La Clé du Parc">
      <h3>Accès La Clé du Parc</h3>
      <div class="lcdp-box-fiche-parc__box-text" data-lcdp-fiche-parc-acces>
        <p>L’accès est communiqué dans votre carte de réservation associée à ce parc.</p>
      </div>
    </section>
  </article>
</div>
