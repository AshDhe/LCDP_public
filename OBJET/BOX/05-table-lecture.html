<section
  class="lcdp-table-lecture"
  data-lcdp-table-lecture
  aria-label="Table de lecture"
>
  <p
    class="lcdp-table-lecture__status"
    data-lcdp-table-lecture-loading
    role="status"
  >
    Chargement…
  </p>

  <div
    class="lcdp-table-lecture__scroll"
    data-lcdp-table-lecture-scroll
    hidden
  >
    <table
      class="lcdp-table-lecture__table"
      data-lcdp-table-lecture-table
    >
      <thead>
        <tr data-lcdp-table-lecture-head></tr>
      </thead>
      <tbody data-lcdp-table-lecture-body></tbody>
    </table>
  </div>

  <p
    class="lcdp-table-lecture__status"
    data-lcdp-table-lecture-empty
    hidden
  >
    Aucun résultat.
  </p>

  <p
    class="lcdp-table-lecture__status lcdp-table-lecture__status--error"
    data-lcdp-table-lecture-error
    role="alert"
    hidden
  ></p>
</section>
