<section
  class="lcdp-wraper-onglets"
  data-lcdp-wraper-onglets
  aria-label="Navigation par onglets"
>
  <div
    class="lcdp-wraper-onglets__navigation"
    role="tablist"
    aria-label="Sections Mes points"
    data-lcdp-wraper-onglets-navigation
  >
    <button
      type="button"
      class="lcdp-wraper-onglets__tab"
      role="tab"
      aria-selected="true"
      aria-controls="lcdp-onglet-referent"
      id="lcdp-tab-referent"
      data-lcdp-onglet="referent"
    >
      Total
    </button>

    <button
      type="button"
      class="lcdp-wraper-onglets__tab"
      role="tab"
      aria-selected="false"
      aria-controls="lcdp-onglet-passion"
      id="lcdp-tab-passion"
      data-lcdp-onglet="passion"
      tabindex="-1"
    >
      Détail
    </button>
  </div>

  <div class="lcdp-wraper-onglets__contenu">
    <section
      id="lcdp-onglet-referent"
      class="lcdp-wraper-onglets__panneau"
      role="tabpanel"
      aria-labelledby="lcdp-tab-referent"
      data-lcdp-panneau-onglet="referent"
    >
      <div data-lcdp-contenu-onglet="referent"></div>
    </section>

    <section
      id="lcdp-onglet-passion"
      class="lcdp-wraper-onglets__panneau"
      role="tabpanel"
      aria-labelledby="lcdp-tab-passion"
      data-lcdp-panneau-onglet="passion"
      hidden
    >
      <div data-lcdp-contenu-onglet="passion"></div>
    </section>
  </div>
</section>
