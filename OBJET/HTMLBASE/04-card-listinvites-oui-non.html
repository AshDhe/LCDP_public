<section class="lcdp-page-section" data-lcdp-box-card-listinvites-oui-non role="region" aria-labelledby="lcdp-listinvites-title">
  <div class="lcdp-page-container">
    <div class="lcdp-page-content">
      <header class="lcdp-page-header">
        <p class="lcdp-text-muted">RÉSERVATION</p>
        <h2 class="lcdp-title-page-center" id="lcdp-listinvites-title" data-lcdp-listinvites-title>Inviter</h2>
      </header>

      <form class="lcdp-box-dialogue-champ-inviter__form" data-lcdp-invitation-form novalidate>
        <p class="lcdp-box-dialogue-champ-inviter__erreur" data-lcdp-listinvites-message role="status" aria-live="polite" hidden></p>

        <ul class="lcdp-box-card-listinvites-oui-non__list" data-lcdp-listinvites-list hidden></ul>

        <label class="lcdp-box-dialogue-champ-inviter__label" for="lcdp-listinvites-email">Adresse e-mail de l'invité</label>
        <ul class="lcdp-box-card-listinvites-oui-non__emails" data-lcdp-listinvites-emails>
          <li class="lcdp-box-card-listinvites-oui-non__item" data-lcdp-invite-email-row>
            <input id="lcdp-listinvites-email" type="email" class="lcdp-box-dialogue-champ-inviter__input" data-lcdp-invite-email autocomplete="email" inputmode="email" placeholder="nom@exemple.fr" aria-label="Adresse e-mail de l'invité">
            <button type="button" class="lcdp-button lcdp-button-secondary" data-lcdp-invite-effacer aria-label="Effacer l'adresse e-mail" title="Effacer">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </li>
        </ul>

        <button class="lcdp-button lcdp-button-secondary" type="button" data-lcdp-listinvites-add-email>Ajouter</button>
        <p class="lcdp-text-muted">Une invitation maximum par accès actuellement.</p>

        <div class="lcdp-box-dialogue-champ-inviter__actions">
          <button class="lcdp-button lcdp-button-primary" type="button" data-lcdp-listinvites-update>Inviter et mettre à jour</button>
          <button class="lcdp-button lcdp-button-secondary" type="button" data-lcdp-listinvites-sans-email>Inviter sans e-mail</button>
          <button class="lcdp-button lcdp-button-secondary" type="button" data-lcdp-listinvites-cancel>Annuler</button>
        </div>
      </form>
    </div>
  </div>
</section>
