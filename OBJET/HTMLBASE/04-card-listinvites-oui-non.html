<section class="lcdp-page-section" data-lcdp-box-card-listinvites-oui-non role="region" aria-labelledby="lcdp-listinvites-title">
  <div class="lcdp-page-container">
    <div class="lcdp-page-content">
      <section class="lcdp-box-liste-card" data-lcdp-invitation-wrapper>
        <button type="button" class="lcdp-box-dialogue-champ-inviter__close" data-lcdp-listinvites-cancel aria-label="Fermer le formulaire Inviter" title="Fermer">×</button>
        <div class="lcdp-box-liste-card__header">
          <div class="lcdp-box-liste-card__heading">
            <h2 class="lcdp-box-liste-card__title" id="lcdp-listinvites-title" data-lcdp-listinvites-title>Inviter</h2>
          </div>
        </div>

        <div class="lcdp-box-liste-card__list">
          <form class="lcdp-box-dialogue-champ-inviter__form" data-lcdp-invitation-form novalidate>
            <p class="lcdp-text-muted" data-lcdp-listinvites-message role="status" aria-live="polite" hidden></p>
            <ul data-lcdp-listinvites-list hidden></ul>

            <div class="lcdp-box-champ-formulaire" data-lcdp-box-champ-formulaire>
              <div class="lcdp-box-champ-formulaire__label-zone">
                <label class="lcdp-box-champ-formulaire__label" for="lcdp-listinvites-email">Adresse e-mail de l'invité</label>
              </div>
              <div class="lcdp-box-champ-formulaire__control">
                <ul class="lcdp-box-card-listinvites-oui-non__emails" data-lcdp-listinvites-emails>
                  <li data-lcdp-invite-email-row>
                    <input id="lcdp-listinvites-email" type="email" data-lcdp-invite-email autocomplete="email" inputmode="email" placeholder="nom@exemple.fr" aria-describedby="lcdp-listinvites-note">
                    <button type="button" class="lcdp-button lcdp-button-secondary" data-lcdp-invite-effacer aria-label="Effacer l'adresse e-mail" title="Effacer">
                      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18M6 6l12 12"/>
                      </svg>
                    </button>
                  </li>
                </ul>
              </div>
              <p class="lcdp-box-champ-formulaire__description" id="lcdp-listinvites-note">Une invitation maximum par accès actuellement.</p>
            </div>
            <button class="lcdp-button lcdp-button-secondary" type="button" data-lcdp-listinvites-add-email>Ajouter</button>

            <div class="lcdp-box-dialogue-champ-inviter__actions">
              <button class="lcdp-button lcdp-button-primary" type="submit" data-lcdp-listinvites-update>Inviter et mettre à jour</button>
              <button class="lcdp-button lcdp-button-secondary" type="button" data-lcdp-listinvites-sans-email>Inviter sans e-mail</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</section>
