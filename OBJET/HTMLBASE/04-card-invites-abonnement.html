<section class="lcdp-page-section" data-lcdp-invitation-abonnement role="region" aria-labelledby="lcdp-invitation-abonnement-titre">
  
  <div class="lcdp-page-container">
    <div class="lcdp-page-content">
      <section class="lcdp-box-liste-card" data-lcdp-invitation-wrapper>
        <div class="lcdp-box-liste-card__header">
          <div class="lcdp-box-liste-card__heading">
            <h2 class="lcdp-box-liste-card__title lcdp-invites-titre" id="lcdp-invitation-abonnement-titre">INVITÉS</h2>
          </div>
          <button type="button" class="lcdp-box-dialogue-champ-inviter__close" data-lcdp-listinvites-close aria-label="Fermer le formulaire Invités" title="Fermer">×</button>
        </div>
        <div class="lcdp-box-liste-card__list">
          <form class="lcdp-box-dialogue-champ-inviter__form" data-lcdp-invitation-form data-lcdp-invitation-abonnement-form novalidate>
            <p class="lcdp-text-muted" data-lcdp-invitation-abonnement-message role="status" aria-live="polite" hidden></p>
            <section class="lcdp-box-champ-formulaire" aria-labelledby="lcdp-invitation-titre-duo" data-lcdp-invitation-categorie="duo">
              <h3 class="lcdp-box-champ-formulaire__label lcdp-invites-categorie" id="lcdp-invitation-titre-duo"><span aria-hidden="true">👫</span> DUO / DUO+</h3>
              <p class="lcdp-box-champ-formulaire__description" data-lcdp-invitation-quota="duo" role="status" hidden></p>
              <ul class="lcdp-box-card-listinvites-oui-non__emails" data-lcdp-invitation-existants="duo" hidden></ul>
              <ul class="lcdp-box-card-listinvites-oui-non__emails" data-lcdp-invitation-nouveaux="duo"></ul>
              <button type="button" class="lcdp-button lcdp-button-secondary lcdp-invites-ajouter" data-lcdp-invitation-ajouter="duo"><span aria-hidden="true">＋</span> Ajouter</button>
              <section data-lcdp-duoactif-zone aria-labelledby="lcdp-invitation-titre-duoactif">
                <h4 class="lcdp-box-champ-formulaire__label" id="lcdp-invitation-titre-duoactif">DUO ACTIF</h4>
                <p class="lcdp-box-champ-formulaire__description">Les cinq demandes les plus anciennes disponibles pour ce parc. Une invitation DUO ACTIF utilise les droits DUO de votre abonnement.</p>
                <p class="lcdp-box-champ-formulaire__description" data-lcdp-duoactif-etat role="status" aria-live="polite">Chargement des demandes…</p>
                <ul data-lcdp-duoactif-liste aria-label="Demandes DUO ACTIF"></ul>
              </section>
            </section>
            <section class="lcdp-box-champ-formulaire" aria-labelledby="lcdp-invitation-titre-famille" data-lcdp-invitation-categorie="famille">
              <h3 class="lcdp-box-champ-formulaire__label lcdp-invites-categorie" id="lcdp-invitation-titre-famille"><span aria-hidden="true">🏠</span> + FAMILLE</h3>
              <p class="lcdp-box-champ-formulaire__description" data-lcdp-invitation-quota="famille" role="status" hidden></p>
              <ul class="lcdp-box-card-listinvites-oui-non__emails" data-lcdp-invitation-existants="famille" hidden></ul>
              <ul class="lcdp-box-card-listinvites-oui-non__emails" data-lcdp-invitation-nouveaux="famille"></ul>
              <button type="button" class="lcdp-button lcdp-button-secondary lcdp-invites-ajouter" data-lcdp-invitation-ajouter="famille"><span aria-hidden="true">＋</span> Ajouter</button>
            </section>
            <div class="lcdp-box-dialogue-champ-inviter__actions" data-lcdp-invitation-actions>
              <button type="button" class="lcdp-button lcdp-button-secondary" aria-disabled="true" data-lcdp-invitation-groupe title="Fonction Groupe à venir">Groupe</button>
              <button type="submit" class="lcdp-button lcdp-button-primary" data-lcdp-invitation-envoyer>Mettre à jour</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</section>
