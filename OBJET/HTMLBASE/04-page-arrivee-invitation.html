<!doctype html>
<html lang="fr" data-lcdp-css="c085">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITRE}} - La Clé du Parc</title>
  <meta name="description" content="Consulter une invitation La Clé du Parc.">
  <!-- Gabarit de présentation uniquement : aucune logique, aucun CSS intégré. -->
  <link rel="stylesheet" href="https://lacleduparc.fr/OBJET/CSSBASE/lcdp-central-mobile-first.css">
</head>
<body class="lcdp-app-page lcdp-typographie-editoriale-commune">
  <div class="lcdp-site-page lcdp-app-wrapper">
    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-labelledby="lcdp-invitation-titre">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large lcdp-contenu-editorial">
            <div class="lcdp-editorial-page-heading">
              <h1 id="lcdp-invitation-titre" class="lcdp-title-page-center">{{TITRE}}</h1>
            </div>

            <section class="lcdp-component lcdp-boxtext lcdp-texte-editorial lcdp-editorial-card" aria-label="Informations d'invitation">
              <div class="lcdp-boxtext__content lcdp-editorial-copy">
                <p>{{MESSAGE}}</p>
                {{DETAILS_HTML}}
                {{CONTENU_HTML}}
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
