<article class="lcdp-box-card-parc-diaporama lcdp-box-card-parc--reserver" data-lcdp-card-accessoire>
  <div class="lcdp-box-card-parc-diaporama__scene">
    <div class="lcdp-box-card-parc-diaporama__faces">
      <div class="lcdp-box-card-parc-diaporama__face lcdp-box-card-parc-diaporama__face--recto">
        <button type="button" class="lcdp-box-card-parc-diaporama__ouvrir" data-lcdp-diaporama-retourner aria-expanded="false" aria-label="Découvrir cet accessoire">
          <div class="lcdp-box-card-parc__media lcdp-box-card-parc__media--avec-nom">
            <img class="lcdp-box-card-parc__image" alt="" width="1672" height="941" decoding="async" data-lcdp-accessoire-image>
            <span class="lcdp-box-card-parc__nom-image" data-lcdp-accessoire-nom-image></span>
          </div>
        </button>
      </div>
      <div class="lcdp-box-card-parc-diaporama__face lcdp-box-card-parc-diaporama__face--verso lcdp-box-card-parc--reserver" data-lcdp-diaporama-dos aria-hidden="true" inert>
        <button class="lcdp-box-card-parc-diaporama__fermer" type="button" data-lcdp-diaporama-fermer aria-label="Revenir à la photo">×</button>
        <div class="lcdp-box-card-parc-diaporama__contenu" data-lcdp-diaporama-dos-contenu>
          <div class="lcdp-box-card-parc__body">
            <div class="lcdp-box-card-parc__text">
              <h3 class="lcdp-box-card-parc__title" data-lcdp-accessoire-nom></h3>
              <p class="lcdp-box-card-parc__meta" data-lcdp-accessoire-prix></p>
            </div>
            <div class="lcdp-box-card-parc__actions lcdp-box-card-parc__actions--reserver">
              <button type="button" class="lcdp-box-card-parc__action lcdp-box-card-parc__action--vert-plein" data-lcdp-accessoire-details><span class="lcdp-box-card-parc__action-libelle">Détails</span></button>
              <button type="button" class="lcdp-box-card-parc__action lcdp-box-card-parc__action--vert-plein" data-lcdp-accessoire-commander><span class="lcdp-box-card-parc__action-libelle">Commander</span></button>
            </div>
            <p class="lcdp-box-card-parc__description"><span data-lcdp-card-parc-description-texte></span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
