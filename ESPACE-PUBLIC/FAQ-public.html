<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c083 c036 c033 c037 c041 c040">
<head>
  <meta charset="utf-8">
  <title>FAQ - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Les réponses aux questions fréquentes sur La Clé du Parc.">
  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css">
  <link rel="stylesheet" href="./faq-accordeon.css?v=20261119-gabarit-editorial-commun">
  <script src="../config.js"></script>
  <script>
    (() => {
      "use strict";
      // Au rechargement, repartir de la première FAQ et du haut de page.
      const rechargement = (window.performance?.getEntriesByType?.("navigation")?.[0]?.type === "reload")
        || (!window.performance?.getEntriesByType?.("navigation")?.length && window.performance?.navigation?.type === 1);
      if (rechargement || !window.location.hash) {
        if ("scrollRestoration" in window.history) window.history.scrollRestoration = "manual";
      }
      if (rechargement && window.location.hash) {
        const url = new URL(window.location.href);
        url.hash = "";
        window.history.replaceState(window.history.state, "", url.href);
      }
      const c = window.SITE_CONFIG || {};
      const joindre = (base, chemin) => String(base || "").replace(/\/+$/, "") + "/" + String(chemin).replace(/^\/+/, "");
      const publicUrl = path => typeof c.publicUrl === "function" ? c.publicUrl(path) : joindre(c.publicBaseUrl || c.PUBLIC_BASE || c.siteBase || "", path);
      const objetUrl = path => typeof c.objetUrl === "function" ? c.objetUrl(path) : (c.objetBaseUrl || c.OBJET_BASE) ? joindre(c.objetBaseUrl || c.OBJET_BASE, path) : publicUrl("/OBJET/" + String(path).replace(/^\/+/, ""));
      window.LCDP_FAQ_PAGE = { membre: false, publicUrl, objetUrl, stylesPrets: Promise.resolve() };
    })();
  </script>
  <script src="./faq-accordeon.js?v=20261119-faq-exclusive" defer></script>
  <script src="./faq.js?v=20261119-faq-rechargement" defer></script>
</head>
<body class="lcdp-app-page lcdp-typographie-editoriale-commune lcdp-page-faq">
  <template id="lcdp-attente-modele">
  <div id="lcdp-attente-arrivee" class="public-home__loading" role="status" aria-live="polite" aria-label="Chargement de la page">
    <div class="public-home__loading-inner">
      <div class="lcdp-loading-spinner" aria-hidden="true">
        <svg viewBox="0 0 36 36" class="lcdp-loading-spinner__track"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
        <svg viewBox="0 0 36 36" class="lcdp-loading-spinner__arc"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75" /></svg>
        <span class="lcdp-loading-spinner__dot"></span>
      </div>
    </div>
  </div>
  </template>
  <script>
    (() => {
      const modele = document.getElementById("lcdp-attente-modele");
      modele.replaceWith(modele.content.cloneNode(true));
      const terminer = () => {
        window.clearTimeout(window.LCDP_FAQ_SECOURS);
        document.getElementById("lcdp-attente-arrivee")?.remove();
      };
      window.LCDP_terminerAttenteArrivee = terminer;
      window.LCDP_FAQ_SECOURS = window.setTimeout(terminer, 15000);
      window.addEventListener("pageshow", event => { if (event.persisted) terminer(); });
    })();
  </script>
  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" id="contenu-principal">
      <section class="lcdp-page-section" aria-labelledby="lcdp-faq-titre">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large lcdp-contenu-editorial">
            <header class="lcdp-editorial-page-heading">
              <h1 id="lcdp-faq-titre" class="lcdp-title-page-center">FAQ espace public</h1>
            </header>
            <p id="lcdp-faq-status" role="status" hidden></p>
            <div id="lcdp-faq-liste" aria-busy="true"></div>
            <noscript><p>Activez JavaScript pour consulter les FAQ.</p></noscript>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
</body>
</html>
