<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Fiche parc - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta
    name="description"
    content="Consulter la présentation, les photos, la localisation et les informations d’un parc La Clé du Parc."
  >

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="../OBJET/CSSBASE/cssbase.css" data-site-href="/OBJET/CSSBASE/cssbase.css">
  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css">
  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-lightbox-convergence.css" data-site-href="/OBJET/CSSBASE/lcdp-lightbox-convergence.css">
  <link rel="stylesheet" href="./fiche-parc.css">
</head>

<body>
  <div class="lcdp-site-page lcdp-app-wrapper">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Fiche parc">
        <div class="lcdp-page-container">
          <div class="lcdp-fiche-parc-page-content lcdp-stack-large">

            <p class="lcdp-mention-connexion" id="lcdp-fiche-parc-status" aria-live="polite" hidden></p>

            <div id="lcdp-fiche-parc-slot">
              <div class="lcdp-box-shift-detail-parc lcdp-box-shift-detail-parc--page lcdp-fiche-parc-public__en-chargement">
                <article class="lcdp-box-shift-detail-parc__card">
                  <div class="lcdp-fiche-parc-public__attente" role="status" aria-label="Chargement de la fiche du parc">
                    <div class="lcdp-loading-spinner" aria-hidden="true">
        <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
        <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
        <span class="lcdp-loading-spinner__dot"></span>
      </div>
                  </div>
                </article>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script src="../OBJET/JSBASE/03-galerie.js"></script>
  <script src="./fiche-parc.js"></script>
</body>
</html>
