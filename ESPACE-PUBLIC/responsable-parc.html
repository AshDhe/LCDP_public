<head>
  <meta charset="utf-8">

  <title>Responsable d’un parc - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demande d’inscription Responsable parc au réseau La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css">

  <!-- Habillage réservé aux formulaires publics COACH / PARC.
       Les composants et les scripts fonctionnels restent inchangés. -->
  <style>
    /* Mise en page inspirée du modèle de contact fourni. */
    body.lcdp-page-contact-coach .lcdp-site-main,
    body.lcdp-page-contact-parc .lcdp-site-main {
      background: #fafbfc;
      min-width: 0;
    }

    body.lcdp-page-contact-coach .lcdp-site-main .lcdp-page-section,
    body.lcdp-page-contact-parc .lcdp-site-main .lcdp-page-section {
      padding: 24px 16px 40px;
    }

    body.lcdp-page-contact-coach .lcdp-site-main .lcdp-page-container,
    body.lcdp-page-contact-parc .lcdp-site-main .lcdp-page-container {
      width: 100%;
      max-width: 540px;
      margin-inline: auto;
      box-sizing: border-box;
    }

    body.lcdp-page-contact-coach .lcdp-site-main .lcdp-page-content,
    body.lcdp-page-contact-parc .lcdp-site-main .lcdp-page-content {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }

    body.lcdp-page-contact-coach .lcdp-site-main .lcdp-title-page-center,
    body.lcdp-page-contact-parc .lcdp-site-main .lcdp-title-page-center {
      margin: 0;
      text-align: center;
      color: #1f2a24;
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: .01em;
    }

    /* La zone qui accueille le formulaire est la carte blanche.
       Aucun changement de DOM n'est requis à l'injection du formulaire. */
    body.lcdp-page-contact-coach #lcdp-contact-contenu,
    body.lcdp-page-contact-parc #lcdp-contact-contenu {
      width: 100%;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #edf0f2;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 4px 16px rgb(31 42 36 / 3%);
      color: #1f2a24;
    }

    /* Conserver l'état de chargement : l'attribut hidden reste prioritaire. */
    body.lcdp-page-contact-coach #lcdp-contact-contenu[hidden],
    body.lcdp-page-contact-parc #lcdp-contact-contenu[hidden] {
      display: none !important;
    }

    /* Pas de seconde carte ni de double bordure dans le composant injecté. */
    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-box-formulaire,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-box-formulaire {
      width: 100%;
      max-width: none;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    /* En-tête du formulaire : titre rose, note centrée, séparateur léger. */
    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-box-formulaire__header,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-box-formulaire__header {
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid #edf0f2;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-box-formulaire__title,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-box-formulaire__title {
      margin: 0 0 8px;
      color: #d64b68;
      font-size: 1.4rem;
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-box-formulaire__note,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-box-formulaire__note {
      margin: 0;
      color: #1f2a24;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    /* Avantages de l'offre : titre centré et trois encarts à liseré rose.
       Les sélecteurs couvrent paragraphes, éléments de liste et div directs. */
    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-boxtext,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-boxtext {
      margin-bottom: 24px;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-boxtext__title,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-boxtext__title {
      margin: 0 0 16px;
      text-align: center;
      color: #1f2a24;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-boxtext__content,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-boxtext__content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #1f2a24;
      font-size: 13px;
      line-height: 1.45;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-boxtext__content ul,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-boxtext__content ul {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-boxtext__content > :is(p, div),
    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-boxtext__content li,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-boxtext__content > :is(p, div),
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-boxtext__content li {
      margin: 0;
      padding: 12px 14px;
      background: #fafbfc;
      border-left: 4px solid #d64b68;
      border-radius: 0 8px 8px 0;
    }

    /* Champs de contact : fond clair et espacements uniformisés. */
    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-box-formulaire__fields,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-box-formulaire__fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 12px;
      padding-top: 18px;
      border-top: 1px solid #edf0f2;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu :is(input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select, textarea),
    body.lcdp-page-contact-parc #lcdp-contact-contenu :is(input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select, textarea) {
      max-width: 100%;
      box-sizing: border-box;
      background: #fafbfc;
      border: 1px solid #e6e9ec;
      border-radius: 8px;
      color: #1f2a24;
      font-size: 14px;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu :is(input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select, textarea):focus-visible,
    body.lcdp-page-contact-parc #lcdp-contact-contenu :is(input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select, textarea):focus-visible {
      outline: 2px solid #d64b68;
      outline-offset: 2px;
    }

    /* Bouton d'envoi compact et centré (sans modifier son type ni l'envoi). */
    body.lcdp-page-contact-coach #lcdp-contact-contenu .lcdp-box-formulaire__actions,
    body.lcdp-page-contact-parc #lcdp-contact-contenu .lcdp-box-formulaire__actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu button[type="submit"],
    body.lcdp-page-contact-parc #lcdp-contact-contenu button[type="submit"] {
      display: block;
      width: auto;
      min-width: 200px;
      max-width: min(240px, 100%);
      min-height: 44px;
      box-sizing: border-box;
      margin: 20px auto 0;
      padding: 10px 18px;
      border: 1px solid #d64b68;
      border-radius: 6px;
      background: #d64b68;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgb(214 75 104 / 15%);
      cursor: pointer;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu button[type="submit"]:hover:not(:disabled),
    body.lcdp-page-contact-parc #lcdp-contact-contenu button[type="submit"]:hover:not(:disabled) {
      background: #c6425f;
      border-color: #c6425f;
    }

    body.lcdp-page-contact-coach #lcdp-contact-contenu button[type="submit"]:focus-visible,
    body.lcdp-page-contact-parc #lcdp-contact-contenu button[type="submit"]:focus-visible {
      outline: 2px solid #1f2a24;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body.lcdp-page-contact-coach .lcdp-site-main .lcdp-page-section,
      body.lcdp-page-contact-parc .lcdp-site-main .lcdp-page-section {
        padding: 20px 12px 32px;
      }

      body.lcdp-page-contact-coach #lcdp-contact-contenu,
      body.lcdp-page-contact-parc #lcdp-contact-contenu {
        padding: 22px 18px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body class="lcdp-page-contact-parc lcdp-app-page">
  <div class="lcdp-site-page lcdp-app-wrapper">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Responsable d’un parc">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large">

            <h1 class="lcdp-title-page-center">PARC</h1>

            <div id="lcdp-contact-attente" class="lcdp-pictowait" role="status" aria-live="polite" aria-label="Chargement du formulaire">
              <img class="lcdp-pictowait__image" src="../OBJET/IMAG/PICTO/pictowait.gif" data-site-src="/OBJET/IMAG/PICTO/pictowait.gif" alt="" width="56" height="56" aria-hidden="true">
            </div>
            <div id="lcdp-contact-erreur" role="alert" hidden>
              <p>Le formulaire n’a pas pu être chargé.</p>
              <button type="button" class="lcdp-button lcdp-button-secondary" onclick="window.location.reload()">Réessayer</button>
            </div>
            <div id="lcdp-contact-contenu" hidden>
              <div id="formulaire-resparc-slot"></div>
            </div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script>
    (() => {
      "use strict";

      const siteBase = (
        window.SITE_BASE ||
        window.SITE_CONFIG?.publicBaseUrl ||
        window.SITE_CONFIG?.siteBase ||
        ""
      ).replace(/\/$/, "");

      function construireUrlSite(chemin) {
        if (!chemin) return chemin;
        if (chemin.startsWith("#") || chemin.startsWith("mailto:") || chemin.startsWith("tel:") || chemin.startsWith("http://") || chemin.startsWith("https://") || chemin.startsWith("data:")) return chemin;
        if (siteBase) return chemin.startsWith("/") ? siteBase + chemin : siteBase + "/" + chemin.replace(/^\.\//, "");
        return chemin.startsWith("/") ? ".." + chemin : chemin;
      }

      function appliquerRoutesSite(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          element.setAttribute("href", construireUrlSite(element.dataset.siteHref));
        });
        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          element.setAttribute("src", construireUrlSite(element.dataset.siteSrc));
        });
      }

      async function chargerFragment(chemin) {
        const reponse = await fetch(construireUrlSite(chemin), {
          method: "GET",
          credentials: "same-origin",
          cache: "no-cache"
        });
        if (!reponse.ok) throw new Error("Fragment introuvable : " + chemin);
        const template = document.createElement("template");
        template.innerHTML = (await reponse.text()).trim();
        return template.content.cloneNode(true);
      }

      function chargerScriptUneFois(chemin) {
        const src = construireUrlSite(chemin);
        if (document.querySelector(`script[data-lcdp-script="${chemin}"]`)) return Promise.resolve();

        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.dataset.lcdpScript = chemin;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Script introuvable : " + chemin));
          document.body.appendChild(script);
        });
      }

      async function afficherDialogueMonCompte() {
        const slot = document.getElementById("lcdp-lightbox-slot");
        slot.innerHTML = "";

        const fragment = await chargerFragment("/OBJET/HTMLBASE/02-dialogue-bouton.html");
        slot.appendChild(fragment);

        const dialogue = slot.querySelector("[data-lcdp-box-dialogue-bouton]");
        dialogue.querySelector("[data-lcdp-dialogue-title]").textContent = "Mon compte";
        dialogue.querySelector("[data-lcdp-dialogue-text]").textContent = "Choisissez l’espace de connexion adapté à votre situation.";

        const actions = dialogue.querySelector("[data-lcdp-dialogue-actions]");

        [
          { label: "Me connecter", href: "/ESPACE-PUBLIC/connexion-membre.html", style: "lcdp-button-primary" },
          { label: "Être invité(e)", href: "/ESPACE-PUBLIC/inscription.html", style: "lcdp-button-secondary" }
        ].forEach((bouton) => {
          const lien = document.createElement("a");
          lien.className = "lcdp-button " + bouton.style;
          lien.textContent = bouton.label;
          lien.href = construireUrlSite(bouton.href);
          actions.appendChild(lien);
        });

        const fermer = () => {
          slot.innerHTML = "";
        };

        dialogue.querySelector("[data-lcdp-dialogue-close]").addEventListener("click", fermer);
        dialogue.addEventListener("click", (event) => {
          if (event.target === dialogue) fermer();
        });
      }

      window.LCDP_ouvrirDialogueMonCompte = afficherDialogueMonCompte;
      document.addEventListener("lcdp:ouvrir-dialogue-mon-compte", () => {
        afficherDialogueMonCompte().catch(console.error);
      });

      async function initialiserBandeau() {
        const slot = document.getElementById("lcdp-bandeau-slot");
        slot.innerHTML = "";
        slot.appendChild(await chargerFragment("/ESPACE-PUBLIC/box-bandeau-nav-public.html"));
        appliquerRoutesSite(slot);
        await chargerScriptUneFois("/ESPACE-PUBLIC/box-menu-burger-public.js");
        if (typeof window.LCDP_initialiserMenuBurgerPublic === "function") {
          await window.LCDP_initialiserMenuBurgerPublic();
        }
      }

      async function ajouterBoxText(slotId, titre, contenuHtml) {
        const slot = document.getElementById(slotId);
        slot.innerHTML = "";
        slot.appendChild(await chargerFragment("/OBJET/HTMLBASE/01-text.html"));
        const box = slot.querySelector("[data-lcdp-boxtext]");
        box.querySelector("[data-lcdp-boxtext-title]").textContent = titre;
        box.querySelector("[data-lcdp-boxtext-content]").innerHTML = contenuHtml;
        appliquerRoutesSite(slot);
      }

      async function initialiserFooter() {
        const slot = document.getElementById("lcdp-footer-slot");
        slot.innerHTML = "";
        slot.appendChild(await chargerFragment("/OBJET/HTMLBASE/02-footer.html"));
        appliquerRoutesSite(slot);
      }

      async function initialiserDemande() {
        await chargerScriptUneFois("/OBJET/JSBASE/03-formulaire.js");
        await chargerScriptUneFois("/OBJET/JSBASE/03-formulaire-protege.js");
        // Le script appartient à l’espace public, pas à la base fonctionnelle PARC.
        await chargerScriptUneFois("/ESPACE-PUBLIC/contact-resparc.js");
        if (typeof window.LCDP_initialiserContactResparc !== "function") {
          throw new Error("Initialisation du contact parc indisponible.");
        }
        await window.LCDP_initialiserContactResparc();
      }


      let formulairePret = false;
      const contenuContact = document.getElementById("lcdp-contact-contenu");
      function afficherFormulaireContact() {
        const form = contenuContact.querySelector("form");
        if (!form || !form.querySelector("button[type='submit']")) return false;
        const champsRequis = ["nomresp", "prenomresp", "emailresp", "telresp", "nomparccontact", "dptmtresp"];
        if (!champsRequis.every(nom => form.elements.namedItem(nom))) return false;
        formulairePret = true;
        window.clearTimeout(delaiContact);
        observationContact.disconnect();
        document.getElementById("lcdp-contact-attente").hidden = true;
        document.getElementById("lcdp-contact-erreur").hidden = true;
        contenuContact.hidden = false;
        return true;
      }
      function echecChargementContact() {
        if (formulairePret || afficherFormulaireContact()) return;
        console.error("LCDP : délai de chargement du formulaire dépassé ou initialisation échouée.");
        document.getElementById("lcdp-contact-attente").hidden = true;
        document.getElementById("lcdp-contact-erreur").hidden = false;
      }
      const observationContact = new MutationObserver(afficherFormulaireContact);
      observationContact.observe(contenuContact, {childList: true, subtree: true});
      const delaiContact = window.setTimeout(echecChargementContact, 20000);
      document.addEventListener("lcdp:contact-formulaire-pret", afficherFormulaireContact);

      async function initialiserPage() {
        appliquerRoutesSite(document);
        initialiserBandeau().catch(console.error);
        initialiserFooter().catch(console.error);
        await initialiserDemande();
        afficherFormulaireContact();
      }

      initialiserPage().catch((error) => { console.error(error); echecChargementContact(); });
    })();
  </script>
</body>
</html>
