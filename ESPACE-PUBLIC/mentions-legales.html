<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Mentions légales - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mentions légales du site et de l'application La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="../OBJET/CSSBASE/cssbase.css" data-site-href="/OBJET/CSSBASE/cssbase.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-bandeau-nav.css" data-site-href="/OBJET/BOX/02-box-bandeau-nav.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-menu-burger.css" data-site-href="/OBJET/BOX/02-box-menu-burger.css">
  <link rel="stylesheet" href="../OBJET/BOX/01-box-text.css" data-site-href="/OBJET/BOX/01-box-text.css">
  <link rel="stylesheet" href="../OBJET/BOX/documents-legaux.css" data-site-href="/OBJET/BOX/documents-legaux.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-dialogue-bouton.css" data-site-href="/OBJET/BOX/02-box-dialogue-bouton.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-alerte.css" data-site-href="/OBJET/BOX/02-box-alerte.css">

  <link rel="stylesheet" href="../OBJET/BOX/03-box-formulaire.css" data-site-href="/OBJET/BOX/03-box-formulaire.css">

<body class="lcdp-page-document-legal">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section class="lcdp-page-section" aria-label="Mentions légales">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large lcdp-document-legal">

            <h1 class="lcdp-title-page-center lcdp-document-legal__title" id="lcdp-mentions-legales-titre">Mentions légales</h1>

            <p class="lcdp-mention-connexion lcdp-document-legal__context">
              [Espace public de l'application]
            </p>

            <div
              id="lcdp-mentions-legales-contenu"
              class="lcdp-stack-large lcdp-document-legal__content"
            ></div>

          </div>
        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

<script
    src="../OBJET/BOX/documents-legaux.js"
    data-site-src="/OBJET/BOX/documents-legaux.js"
  ></script>

  <script>
    (() => {
      "use strict";

      const siteBase = (
        window.SITE_BASE ||
        window.SITE_CONFIG?.publicBaseUrl ||
        window.SITE_CONFIG?.siteBase ||
        ""
      ).replace(/\/$/, "");

      const CONTENU_SECOURS = {
        "titre": "Mentions légales",
        "blocs": [
                {
                        "id": "informations-generales",
                        "titre": "Informations générales",
                        "html": "<p>\n  Cette page rassemble les informations légales relatives au site et à l'application La Clé du Parc.\n</p>\n<p>\n  Les informations juridiques définitives devront être complétées avec les données exactes de la structure éditrice, de son représentant légal, de son hébergeur et de ses coordonnées officielles.\n</p>"
                },
                {
                        "id": "editeur-site",
                        "titre": "Éditeur du site",
                        "html": "<p>\n  Le site La Clé du Parc est édité par la structure responsable du club.\n</p>\n<p>\n  Dénomination sociale, forme juridique, adresse du siège, numéro d’identification et coordonnées de contact : informations à compléter après validation juridique.\n</p>"
                },
                {
                        "id": "responsable-publication",
                        "titre": "Responsable de la publication",
                        "html": "<p>\n  Le responsable de la publication est la personne physique ou morale représentant la structure éditrice.\n</p>\n<p>\n  Nom, qualité et coordonnées professionnelles : informations à compléter.\n</p>"
                },
                {
                        "id": "hebergement",
                        "titre": "Hébergement",
                        "html": "<p>\n  Les informations relatives à l’hébergeur du site devront être indiquées dans cette rubrique.\n</p>\n<p>\n  Nom de l’hébergeur, adresse, coordonnées et localisation des services d’hébergement : informations à compléter.\n</p>"
                },
                {
                        "id": "propriete-intellectuelle",
                        "titre": "Propriété intellectuelle",
                        "html": "<p>\n  Les textes, éléments graphiques, interfaces, logos, images, composants et contenus du site sont destinés à présenter La Clé du Parc et son fonctionnement.\n</p>\n<p>\n  Toute reprise ou réutilisation devra respecter les droits attachés aux contenus, aux marques, aux visuels et aux éléments techniques utilisés.\n</p>"
                },
                {
                        "id": "responsabilite",
                        "titre": "Responsabilité",
                        "html": "<p>\n  Les informations publiées sur le site ont pour objet de présenter le club, ses règles d’accès, ses services et son fonctionnement.\n</p>\n<p>\n  Elles peuvent être mises à jour afin de tenir compte de l’évolution du service, du réseau de parcs, des activités proposées ou du cadre applicable.\n</p>"
                },
                {
                        "id": "donnees-personnelles",
                        "titre": "Données personnelles",
                        "html": "<p>\n  Certaines fonctionnalités peuvent nécessiter la collecte de données personnelles, notamment lors de l’inscription, de la connexion, de la réservation ou de la gestion du compte membre.\n</p>\n<p>\n  Les finalités, durées de conservation, destinataires, droits des personnes et modalités de contact devront être précisés dans la politique de confidentialité ou dans une rubrique dédiée.\n</p>"
                },
                {
                        "id": "cookies-traceurs",
                        "titre": "Cookies et traceurs",
                        "html": "<p>\n  Le site et l'application peuvent utiliser des cookies strictement nécessaires au fonctionnement des espaces de connexion et des sessions utilisateur.\n</p>\n<p>\n  Si des cookies de mesure d’audience, de suivi ou de services tiers sont ajoutés, ils devront être décrits et encadrés conformément aux règles applicables.\n</p>"
                },
                {
                        "id": "acces-service",
                        "titre": "Accès au service",
                        "html": "<p>\n  L’accès aux espaces privés de La Clé du Parc peut dépendre de la création d’un compte, de la validation d’une adresse e-mail, de l’acceptation des règlements applicables et des droits associés au statut du membre.\n</p>\n<p>\n  Les conditions détaillées d’accès et d’utilisation relèvent des règlements du club et de l'application.\n</p>"
                },
                {
                        "id": "contact",
                        "titre": "Contact",
                        "html": "<p>\n  Les demandes relatives aux mentions légales, au site, à l'application ou aux droits des utilisateurs peuvent être adressées via la page de contact.\n</p>\n<p>\n  <a\n    class=\"lcdp-link-secondary\"\n    href=\"../ESPACE-PUBLIC/contact.html\"\n    data-site-href=\"/ESPACE-PUBLIC/contact.html\"\n  >Accéder à la page contact</a>\n</p>"
                },
                {
                        "id": "mise-a-jour",
                        "titre": "Mise à jour des mentions légales",
                        "html": "<p>\n  Les présentes mentions légales sont susceptibles d’être complétées ou mises à jour.\n</p>\n<p>\n  Date de dernière mise à jour : à compléter.\n</p>"
                }
        ]
};

      function construireUrlSite(chemin) {
        if (!chemin) return chemin;

        if (
          chemin.startsWith("#") ||
          chemin.startsWith("mailto:") ||
          chemin.startsWith("tel:") ||
          chemin.startsWith("http://") ||
          chemin.startsWith("https://") ||
          chemin.startsWith("data:")
        ) {
          return chemin;
        }

        if (siteBase) {
          return chemin.startsWith("/")
            ? siteBase + chemin
            : siteBase + "/" + chemin.replace(/^\.\//, "");
        }

        return chemin.startsWith("/") ? ".." + chemin : chemin;
      }

      function appliquerRoutesSite(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          element.setAttribute("href", construireUrlSite(element.dataset.siteHref));
        });

        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          element.setAttribute("src", construireUrlSite(element.dataset.siteSrc));
        });
      }

      async function chargerFragment(chemin) {
        const reponse = await fetch(construireUrlSite(chemin), {
          method: "GET",
          credentials: "same-origin",
          cache: "no-cache"
        });

        if (!reponse.ok) {
          throw new Error("Fragment introuvable : " + chemin);
        }

        const html = await reponse.text();
        const template = document.createElement("template");
        template.innerHTML = html.trim();

        return template.content.cloneNode(true);
      }

      function chargerScriptUneFois(chemin) {
        const src = construireUrlSite(chemin);

        if (document.querySelector(`script[data-lcdp-script="${chemin}"]`)) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.dataset.lcdpScript = chemin;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Script introuvable : " + chemin));
          document.body.appendChild(script);
        });
      }

      async function afficherDialogueMonCompte() {
        const slot = document.getElementById("lcdp-lightbox-slot");
        slot.innerHTML = "";

        const fragment = await chargerFragment("/OBJET/BOX/02-box-dialogue-bouton.html");
        slot.appendChild(fragment);

        const dialogue = slot.querySelector("[data-lcdp-box-dialogue-bouton]");

        dialogue.querySelector("[data-lcdp-dialogue-title]").textContent = "Mon compte";
        dialogue.querySelector("[data-lcdp-dialogue-text]").textContent =
          "Choisissez l’espace de connexion adapté à votre situation.";

        const actions = dialogue.querySelector("[data-lcdp-dialogue-actions]");

        const boutons = [
          {
            label: "Me connecter",
            href: "/ESPACE-PUBLIC/connexion-membre.html",
            style: "lcdp-button-primary"
          },
          {
            label: "Être invité(e)",
            href: "/ESPACE-PUBLIC/inscription.html",
            style: "lcdp-button-secondary"
          }
        ];

        boutons.forEach((bouton) => {
          const lien = document.createElement("a");
          lien.className = "lcdp-button " + bouton.style;
          lien.textContent = bouton.label;
          lien.href = construireUrlSite(bouton.href);
          actions.appendChild(lien);
        });

        const fermer = () => {
          slot.innerHTML = "";
        };

        dialogue.querySelector("[data-lcdp-dialogue-close]").addEventListener("click", fermer);

        dialogue.addEventListener("click", (event) => {
          if (event.target === dialogue) {
            fermer();
          }
        });
      }

      window.LCDP_ouvrirDialogueMonCompte = afficherDialogueMonCompte;

      document.addEventListener("lcdp:ouvrir-dialogue-mon-compte", () => {
        afficherDialogueMonCompte().catch(console.error);
      });

      async function initialiserBandeau() {
        const slot = document.getElementById("lcdp-bandeau-slot");
        slot.innerHTML = "";

        const bandeau = await chargerFragment("/ESPACE-PUBLIC/box-bandeau-nav-public.html");
        slot.appendChild(bandeau);

        appliquerRoutesSite(slot);

        await chargerScriptUneFois("/ESPACE-PUBLIC/box-menu-burger-public.js");

        if (typeof window.LCDP_initialiserMenuBurgerPublic === "function") {
          await window.LCDP_initialiserMenuBurgerPublic();
        }
      }

      async function ajouterBoxText(
        conteneur,
        titre,
        contenuHtml
      ) {
        const slot = document.createElement("div");
        conteneur.appendChild(slot);

        const fragment = await chargerFragment(
          "/OBJET/BOX/01-box-text.html"
        );
        slot.appendChild(fragment);

        const box = slot.querySelector("[data-lcdp-boxtext]");
        const contenu = box.querySelector(
          "[data-lcdp-boxtext-content]"
        );

        box.querySelector(
          "[data-lcdp-boxtext-title]"
        ).textContent = titre;
        contenu.innerHTML =
          nettoyerHtmlAffichage(contenuHtml);

        appliquerRoutesSite(slot);

        return contenu;
      }

      function endpointEditingAdmin() {
        return String(
          window.SITE_CONFIG?.workerEditingAdminUrl ||
          window.SITE_CONFIG?.WORKER_EDITING_ADMIN_URL ||
          ""
        ).replace(/\/+$/, "");
      }

      async function chargerMentionsLegales() {
        const endpoint = endpointEditingAdmin();

        if (!endpoint) {
          console.error(
            "Worker des mentions légales non configuré."
          );
          return CONTENU_SECOURS;
        }

        try {
          const response = await fetch(
            endpoint + "/public/mentions-legales",
            {
              method: "GET",
              credentials: "omit",
              cache: "no-store",
              headers: {
                Accept: "application/json"
              }
            }
          );

          const data = await response.json().catch(() => null);

          if (
            !response.ok ||
            !data ||
            data.success !== true ||
            !Array.isArray(data.blocs) ||
            data.blocs.length < 1
          ) {
            throw new Error(
              data?.message ||
              data?.detail ||
              "Réponse publique inexploitable."
            );
          }

          return {
            titre: String(data.titre || "Mentions légales"),
            blocs: data.blocs
          };
        } catch (error) {
          console.error(
            "Chargement des mentions légales impossible :",
            error
          );

          return CONTENU_SECOURS;
        }
      }

      async function afficherMentionsLegales(documentMentions) {
        const conteneur = document.getElementById(
          "lcdp-mentions-legales-contenu"
        );
        const titrePage = document.getElementById(
          "lcdp-mentions-legales-titre"
        );

        if (!conteneur) {
          throw new Error(
            "Conteneur des mentions légales introuvable."
          );
        }

        conteneur.innerHTML = "";

        if (titrePage) {
          titrePage.textContent =
            String(
              documentMentions?.titre ||
              "Mentions légales"
            );
        }

        let dernierContenu = null;

        for (
          const bloc of documentMentions?.blocs || []
        ) {
          const titre = String(bloc?.titre || "").trim();
          const html = nettoyerHtmlAffichage(
            String(bloc?.html || "")
          );

          if (!titre || !extraireTexteHtml(html)) {
            continue;
          }

          dernierContenu = await ajouterBoxText(
            conteneur,
            titre,
            html
          );
        }

        if (dernierContenu) {
          ajouterBoutonDemandeJuridiquePage(
            dernierContenu,
            () => ouvrirInfoboxDemandeJuridiquePage(
              conteneur,
              documentMentions
            )
          );
        }
      }


      function ajouterBoutonDemandeJuridiquePage(
        conteneur,
        action
      ) {
        const actions = document.createElement("div");
        actions.className =
          "lcdp-contact-juridique-actions";

        const bouton =
          document.createElement("button");
        bouton.type = "button";
        bouton.className =
          "lcdp-button lcdp-button-secondary";
        bouton.textContent = "Demande juridique";
        bouton.addEventListener("click", action);

        actions.appendChild(bouton);
        conteneur.appendChild(actions);
      }

      function creerBoxDemandeJuridiquePage() {
        const slot = document.getElementById(
          "lcdp-lightbox-slot"
        );

        if (!slot) {
          throw new Error(
            "Slot de fenêtre introuvable."
          );
        }

        slot.innerHTML = "";

        const overlay = document.createElement("div");
        overlay.className = "lcdp-legal-lightbox";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute(
          "aria-label",
          "Demande juridique"
        );

        const carte = document.createElement("section");
        carte.className = "lcdp-legal-lightbox__card";

        const boutonFermer = document.createElement("button");
        boutonFermer.type = "button";
        boutonFermer.className = "lcdp-legal-lightbox__close";
        boutonFermer.setAttribute(
          "aria-label",
          "Fermer la demande juridique"
        );
        boutonFermer.textContent = "×";

        const contenu = document.createElement("div");
        contenu.className = "lcdp-legal-lightbox__content";

        carte.appendChild(boutonFermer);
        carte.appendChild(contenu);
        overlay.appendChild(carte);
        slot.appendChild(overlay);
        document.body.classList.add("lcdp-legal-lightbox-open");

        let ferme = false;

        const fermer = () => {
          if (ferme) {
            return;
          }

          ferme = true;
          document.removeEventListener(
            "keydown",
            gererClavier
          );
          overlay.remove();
          document.body.classList.remove(
            "lcdp-legal-lightbox-open"
          );
        };

        const gererClavier = (event) => {
          if (event.key !== "Escape") {
            return;
          }

          if (
            overlay.querySelector(
              "[data-lcdp-box-dialogue-bouton], " +
              "[data-lcdp-box-alerte]"
            )
          ) {
            return;
          }

          event.preventDefault();
          fermer();
        };

        boutonFermer.addEventListener("click", fermer);
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) {
            fermer();
          }
        });
        document.addEventListener("keydown", gererClavier);

        return {
          overlay,
          contenu,
          fermer
        };
      }

      async function ouvrirInfoboxDemandeJuridiquePage() {
        const slot = document.getElementById("lcdp-lightbox-slot");
        if (!slot || slot.dataset.juridiqueOuverture === "true" || slot.querySelector("[data-juridique-interface]")) return;
        slot.dataset.juridiqueOuverture = "true";
        const precedent = document.activeElement;
        let boxDemande = null;
        try {
          if (typeof window.LCDP_creerFormulaire !== "function") {
            await chargerScriptUneFois("/OBJET/BOX/03-box-formulaire.js");
          }
          if (typeof window.LCDP_creerFormulaire !== "function") throw new Error("Objet formulaire indisponible.");
          boxDemande = creerBoxDemandeJuridiquePage();
          boxDemande.overlay.setAttribute("data-juridique-interface", "");
          const slotFormulaire = document.createElement("div");
          boxDemande.contenu.appendChild(slotFormulaire);
          const form = await window.LCDP_creerFormulaire(slotFormulaire, configurationDemandeJuridiquePage());
          if (!form) throw new Error("Formulaire de demande juridique non créé.");
          const envoyer = form.querySelector("#bouton-envoyer-demande-juridique");
          if (!envoyer) throw new Error("Bouton d’envoi introuvable.");
          await chargerScriptUneFois("/OBJET/BOX/03-formulaire-protege.js");
          await window.LCDP_brancherFormulaireProtege(form, {
            type: "juridique",
            endpoint: window.SITE_CONFIG?.workerDemandeJuridiqueUrl || "https://lacleduparc.fr/api/demande-juridique",
            champs: configurationDemandeJuridiquePage().champs
          });
          form.querySelector("#bouton-retour-mentions-legales")?.addEventListener("click", () => {
            boxDemande.fermer();
            if (precedent?.isConnected) precedent.focus();
          });
        } catch (error) {
          boxDemande?.fermer();
          console.error(error);
          window.alert("Le formulaire ne peut pas être affiché. Réessayez plus tard.");
        } finally {
          delete slot.dataset.juridiqueOuverture;
        }
      }

      function configurationDemandeJuridiquePage() {
        return {
          id: "formulaire-demande-juridique",
          ariaLabel:
            "Formulaire de demande juridique",
          titre: "Demande juridique",
          introHtml:
            "<p>Renseignez vos coordonnées et la raison de votre demande.</p>",
          validationNative: true,
          champs: [
            {
              type: "text",
              id: "demande-juridique-nom",
              name: "nom",
              label: "Votre nom",
              required: true,
              validationNative: true,
              autocomplete: "family-name",
              maxlength: 120
            },
            {
              type: "text",
              id: "demande-juridique-prenom",
              name: "prenom",
              label: "Votre prénom",
              required: true,
              validationNative: true,
              autocomplete: "given-name",
              maxlength: 120
            },
            {
              type: "email",
              id: "demande-juridique-email",
              name: "email",
              label: "Votre e-mail",
              required: true,
              validationNative: true,
              autocomplete: "email",
              autocapitalize: "none",
              spellcheck: "false",
              maxlength: 254
            },
            {
              type: "textarea",
              id: "demande-juridique-motif",
              name: "motif",
              label:
                "Raison de votre demande juridique",
              required: true,
              validationNative: true,
              maxlength: 4000
            }
          ],
          boutons: [
            {
              id:
                "bouton-envoyer-demande-juridique",
              type: "submit",
              label: "Envoyer",
              style: "lcdp-button-orange"
            },
            {
              id:
                "bouton-retour-mentions-legales",
              type: "button",
              label: "Retour aux mentions légales",
              style: "lcdp-button-secondary"
            }
          ]
        };
      }

      function nettoyerHtmlAffichage(htmlBrut) {
        const moduleLegal =
          window.LCDP_DOCUMENTS_LEGAUX;

        if (
          !moduleLegal ||
          typeof moduleLegal.nettoyerHtml !== "function"
        ) {
          throw new Error(
            "Normaliseur des documents légaux indisponible."
          );
        }

        return moduleLegal.nettoyerHtml(htmlBrut);
      }

      function normaliserUrlLien(value) {
        const url = String(value || "").trim();

        if (!url || url.startsWith("//")) {
          return "";
        }

        const compact = url
          .replace(/[\u0000-\u0020\u007f]+/g, "")
          .toLowerCase();

        return (
          compact.startsWith("http://") ||
          compact.startsWith("https://") ||
          compact.startsWith("mailto:") ||
          compact.startsWith("tel:") ||
          compact.startsWith("/") ||
          compact.startsWith("#") ||
          compact.startsWith("../") ||
          compact.startsWith("./")
        )
          ? url
          : "";
      }

      function extraireTexteHtml(htmlBrut) {
        const template = document.createElement("template");
        template.innerHTML = String(htmlBrut || "");

        return String(
          template.content.textContent || ""
        ).replace(/\s+/g, " ").trim();
      }

      async function initialiserFooter() {
        const slot = document.getElementById("lcdp-footer-slot");
        slot.innerHTML = "";

        const footer = await chargerFragment("/OBJET/BOX/02-box-footer.html");
        slot.appendChild(footer);

        appliquerRoutesSite(slot);
      }

      async function initialiserPage() {
        appliquerRoutesSite(document);

        await initialiserBandeau();

        const documentMentions =
          await chargerMentionsLegales();

        await afficherMentionsLegales(
          documentMentions
        );

        await initialiserFooter();
      }

      initialiserPage().catch((erreur) => {
        console.error(erreur);
      });
    })();
  </script>
</body>
</html>
