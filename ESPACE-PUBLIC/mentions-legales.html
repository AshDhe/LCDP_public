  <script>
    (() => {
      "use strict";

      const siteBase = (

      ).replace(/\/$/, "");

                },

                {
                        "id": "hebergement",

                },
                {
                        "id": "propriete-intellectuelle",
                        "titre": "Propriété intellectuelle",
                        "html": "<p>\n  Les textes, éléments graphiques, interfaces, logos, images, composants et contenus du site sont destinés à présenter La Clé du Parc et son fonctionnement.\n</p>\n<p>\n  Toute reprise ou réutilisation devra respecter les droits attachés aux contenus, aux marques, aux visuels et aux éléments techniques utilisés.\n</p>"
                },
                {
                        "id": "responsabilite",
                        "titre": "Responsabilité",
                        "html": "<p>\n  Les informations publiées sur le site ont pour objet de présenter le club, ses règles d’accès, ses services et son fonctionnement.\n</p>\n<p>\n  Elles peuvent être mises à jour afin de tenir compte de l’évolution du service, du réseau de parcs, des activités proposées ou du cadre applicable.\n</p>"
                },
                {
                        "id": "donnees-personnelles",
                        "titre": "Données personnelles",
                        "html": "<p>\n  Certaines fonctionnalités peuvent nécessiter la collecte de données personnelles, notamment lors de l’inscription, de la connexion, de la réservation ou de la gestion du compte membre.\n</p>\n<p>\n  Les finalités, durées de conservation, destinataires, droits des personnes et modalités de contact devront être précisés dans la politique de confidentialité ou dans une rubrique dédiée.\n</p>"
                },

                        "titre": "Cookies et traceurs",
                        "html": "<p>\n  Le site et l'application peuvent utiliser des cookies strictement nécessaires au fonctionnement des espaces de connexion et des sessions utilisateur.\n</p>\n<p>\n  Si des cookies de mesure d’audience, de suivi ou de services tiers sont ajoutés, ils devront être décrits et encadrés conformément aux règles applicables.\n</p>"
                },
                {
                        "id": "acces-service",
                        "titre": "Accès au service",
                        "html": "<p>\n  L’accès aux espaces privés de La Clé du Parc peut dépendre de la création d’un compte, de la validation d’une adresse e-mail, de l’acceptation des règlements applicables et des droits associés au statut du membre.\n</p>\n<p>\n  Les conditions détaillées d’accès et d’utilisation relèvent des règlements du club et de l'application.\n</p>"
                },
                {
                        "id": "contact",
                        "titre": "Contact",
                        "html": "<p>\n  Les demandes relatives aux mentions légales, au site, à l'application ou aux droits des utilisateurs peuvent être adressées via la page de contact.\n</p>\n<p>\n  <a\n    class=\"lcdp-link-secondary\"\n    href=\"../ESPACE-PUBLIC/contact.html\"\n    data-site-href=\"/ESPACE-PUBLIC/contact.html\"\n  >Accéder à la page contact</a>\n</p>"
                },
                {
                        "id": "mise-a-jour",
                        "titre": "Mise à jour des mentions légales",
                        "html": "<p>\n  Les présentes mentions légales sont susceptibles d’être complétées ou mises à jour.\n</p>\n<p>\n  Date de dernière mise à jour : à compléter.\n</p>"
                }
        ]
};

      function construireUrlSite(chemin) {
        if (!chemin) return chemin;

        if (
          chemin.startsWith("#") ||
          chemin.startsWith("mailto:") ||
          chemin.startsWith("tel:") ||
          chemin.startsWith("http://") ||
          chemin.startsWith("https://") ||
          chemin.startsWith("data:")
        ) {
          return chemin;
        }

        if (siteBase) {
          return chemin.startsWith("/")
            ? siteBase + chemin
            : siteBase + "/" + chemin.replace(/^\.\//, "");
        }

        return chemin.startsWith("/") ? ".." + chemin : chemin;
      }

      function appliquerRoutesSite(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          element.setAttribute("href", construireUrlSite(element.dataset.siteHref));
        });

        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          element.setAttribute("src", construireUrlSite(element.dataset.siteSrc));
        });
      }

      async function chargerFragment(chemin) {
        const reponse = await fetch(construireUrlSite(chemin), {
          method: "GET",
          credentials: "same-origin",
          cache: "no-cache"
        });

        if (!reponse.ok) {
          throw new Error("Fragment introuvable : " + chemin);
        }

        const html = await reponse.text();
        const template = document.createElement("template");
        template.innerHTML = html.trim();

        return template.content.cloneNode(true);
      }

      function chargerScriptUneFois(chemin) {
        const src = construireUrlSite(chemin);

        if (document.querySelector(`script[data-lcdp-script="${chemin}"]`)) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.dataset.lcdpScript = chemin;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Script introuvable : " + chemin));
          document.body.appendChild(script);
        });
      }

      async function afficherDialogueMonCompte() {
        const slot = document.getElementById("lcdp-lightbox-slot");
        slot.innerHTML = "";

        const fragment = await chargerFragment("/OBJET/BOX/02-box-dialogue-bouton.html");
        slot.appendChild(fragment);

        const dialogue = slot.querySelector("[data-lcdp-box-dialogue-bouton]");

        dialogue.querySelector("[data-lcdp-dialogue-title]").textContent = "Mon compte";
        dialogue.querySelector("[data-lcdp-dialogue-text]").textContent =
          "Choisissez l’espace de connexion adapté à votre situation.";

        const actions = dialogue.querySelector("[data-lcdp-dialogue-actions]");

        const boutons = [
          {
            label: "Me connecter",
            href: "/ESPACE-PUBLIC/connexion-membre.html",
            style: "lcdp-button-primary"
          },
          {
            label: "Être invité(e)",
            href: "/ESPACE-PUBLIC/inscription.html",
            style: "lcdp-button-secondary"
          }
        ];

        boutons.forEach((bouton) => {
          const lien = document.createElement("a");
          lien.className = "lcdp-button " + bouton.style;
          lien.textContent = bouton.label;
          lien.href = construireUrlSite(bouton.href);
          actions.appendChild(lien);
        });

        const fermer = () => {
          slot.innerHTML = "";
        };

        dialogue.querySelector("[data-lcdp-dialogue-close]").addEventListener("click", fermer);

        dialogue.addEventListener("click", (event) => {
          if (event.target === dialogue) {
            fermer();
          }
        });
      }

      window.LCDP_ouvrirDialogueMonCompte = afficherDialogueMonCompte;

      document.addEventListener("lcdp:ouvrir-dialogue-mon-compte", () => {
        afficherDialogueMonCompte().catch(console.error);
      });

      async function initialiserBandeau() {
        const slot = document.getElementById("lcdp-bandeau-slot");
        slot.innerHTML = "";

        const bandeau = await chargerFragment("/ESPACE-PUBLIC/box-bandeau-nav-public.html");
        slot.appendChild(bandeau);

        appliquerRoutesSite(slot);

        await chargerScriptUneFois("/ESPACE-PUBLIC/box-menu-burger-public.js");

        if (typeof window.LCDP_initialiserMenuBurgerPublic === "function") {
          await window.LCDP_initialiserMenuBurgerPublic();
        }
      }

      async function ajouterBoxText(
        conteneur,
        titre,
        contenuHtml
      ) {
        const slot = document.createElement("div");
        conteneur.appendChild(slot);

        const fragment = await chargerFragment(
          "/OBJET/BOX/01-box-text.html"
        );
        slot.appendChild(fragment);

        const box = slot.querySelector("[data-lcdp-boxtext]");
        const contenu = box.querySelector(
          "[data-lcdp-boxtext-content]"
        );

        box.querySelector(
          "[data-lcdp-boxtext-title]"
        ).textContent = titre;
        contenu.innerHTML =
          nettoyerHtmlAffichage(contenuHtml);

        appliquerRoutesSite(slot);

        return contenu;
      }

      function endpointEditingAdmin() {
        return String(
          window.SITE_CONFIG?.workerEditingAdminUrl ||
          window.SITE_CONFIG?.WORKER_EDITING_ADMIN_URL ||
          ""
        ).replace(/\/+$/, "");
      }

      async function chargerMentionsLegales() {
        const endpoint = endpointEditingAdmin();

        if (!endpoint) {
          console.error(
            "Worker des mentions légales non configuré."
          );
          return CONTENU_SECOURS;
        }

        try {
          const response = await fetch(
            endpoint + "/public/mentions-legales",
            {
              method: "GET",
              credentials: "omit",
              cache: "no-store",
              headers: {
                Accept: "application/json"
              }
            }
          );

          const data = await response.json().catch(() => null);

          if (
            !response.ok ||
            !data ||
            data.success !== true ||
            !Array.isArray(data.blocs) ||
            data.blocs.length < 1
          ) {
            throw new Error(
              data?.message ||
              data?.detail ||
              "Réponse publique inexploitable."
            );
          }

          return {
            titre: String(data.titre || "Mentions légales"),
            blocs: data.blocs
          };
        } catch (error) {
          console.error(
            "Chargement des mentions légales impossible :",
            error
          );

          return CONTENU_SECOURS;
        }
      }

      async function afficherMentionsLegales(documentMentions) {
        const conteneur = document.getElementById(
          "lcdp-mentions-legales-contenu"
        );
        const titrePage = document.getElementById(
          "lcdp-mentions-legales-titre"
        );

        if (!conteneur) {
          throw new Error(
            "Conteneur des mentions légales introuvable."
          );
        }

        conteneur.innerHTML = "";

        if (titrePage) {
          titrePage.textContent =
            String(
              documentMentions?.titre ||
              "Mentions légales"
            );
        }

        let dernierContenu = null;

        for (
          const bloc of documentMentions?.blocs || []
        ) {
          const titre = String(bloc?.titre || "").trim();
          const html = nettoyerHtmlAffichage(
            String(bloc?.html || "")
          );

          if (!titre || !extraireTexteHtml(html)) {
            continue;
          }

          dernierContenu = await ajouterBoxText(
            conteneur,
            titre,
            html
          );
        }

        if (dernierContenu) {
          ajouterBoutonDemandeJuridiquePage(
            dernierContenu,
            () => ouvrirFormulaireDemandeJuridiquePage(
              conteneur,
              documentMentions
            )
          );
        }
      }


      function ajouterBoutonDemandeJuridiquePage(
        conteneur,
        action
      ) {
        const actions = document.createElement("div");
        actions.className =
          "lcdp-box-formulaire__actions";

        const bouton =
          document.createElement("button");
        bouton.type = "button";
        bouton.className =
          "lcdp-button lcdp-button-secondary";
        bouton.textContent = "Demande juridique";
        bouton.addEventListener("click", action);

        actions.appendChild(bouton);
        conteneur.appendChild(actions);
      }

      async function ouvrirFormulaireDemandeJuridiquePage(
        conteneur,
        documentMentions
      ) {
        if (
          typeof window.LCDP_creerFormulaire !==
          "function"
        ) {
          throw new Error(
            "Objet formulaire indisponible."
          );
        }

        conteneur.innerHTML = "";

        const slotFormulaire =
          document.createElement("div");
        conteneur.appendChild(slotFormulaire);

        const form =
          await window.LCDP_creerFormulaire(
            slotFormulaire,
            configurationDemandeJuridiquePage()
          );

        if (!form) {
          throw new Error(
            "Formulaire de demande juridique non créé."
          );
        }

        form.querySelector(
          "#bouton-retour-mentions-legales"
        )?.addEventListener("click", () => {
          afficherMentionsLegales(
            documentMentions
          ).catch(console.error);
        });

        form.addEventListener(
          "submit",
          async (event) => {
            event.preventDefault();

            if (!form.reportValidity()) {
              return;
            }

            const payload =
              lireFormulaireDemandeJuridiquePage(
                form
              );
            const erreur =
              validerDemandeJuridiquePage(
                payload
              );

            if (erreur) {
              await afficherAlerteDemandeJuridiquePage(
                erreur,
                "erreur"
              );
              return;
            }

            const confirme =
              await demanderConfirmationDemandeJuridiquePage();

            if (!confirme) {
              return;
            }

            const boutons = Array.from(
              form.querySelectorAll("button")
            );

            boutons.forEach((bouton) => {
              bouton.disabled = true;
            });

            try {
              await envoyerDemandeJuridiquePage(
                payload
              );
              form.reset();

              await afficherAlerteDemandeJuridiquePage(
                "Votre demande est envoyée.",
                "validation"
              );

              await afficherMentionsLegales(
                documentMentions
              );
            } catch (error) {
              boutons.forEach((bouton) => {
                bouton.disabled = false;
              });

              await afficherAlerteDemandeJuridiquePage(
                String(
                  error?.message ||
                  error ||
                  "La demande n’a pas pu être envoyée."
                ),
                "erreur"
              );
            }
          }
        );
      }

      function configurationDemandeJuridiquePage() {
        return {
          id: "formulaire-demande-juridique",
          ariaLabel:
            "Formulaire de demande juridique",
          titre: "Demande juridique",
          introHtml:
            "<p>Renseignez vos coordonnées et la raison de votre demande.</p>",
          validationNative: true,
          champs: [
            {
              type: "text",
              id: "demande-juridique-nom",
              name: "nom",
              label: "Votre nom",
              required: true,
              autocomplete: "family-name",
              maxlength: 120
            },
            {
              type: "text",
              id: "demande-juridique-prenom",
              name: "prenom",
              label: "Votre prénom",
              required: true,
              autocomplete: "given-name",
              maxlength: 120
            },
            {
              type: "email",
              id: "demande-juridique-email",
              name: "email",
              label: "Votre e-mail",
              required: true,
              autocomplete: "email",
              autocapitalize: "none",
              spellcheck: "false",
              maxlength: 254
            },
            {
              type: "textarea",
              id: "demande-juridique-motif",
              name: "motif",
              label:
                "Raison de votre demande juridique",
              required: true,
              maxlength: 4000
            }
          ],
          boutons: [
            {
              id:
                "bouton-envoyer-demande-juridique",
              type: "submit",
              label: "Envoyer",
              style: "lcdp-button-orange"
            },
            {
              id:
                "bouton-retour-mentions-legales",
              type: "button",
              label: "Retour aux mentions légales",
              style: "lcdp-button-secondary"
            }
          ]
        };
      }

      function lireFormulaireDemandeJuridiquePage(
        form
      ) {
        return {
          nom: String(
            form.elements.namedItem("nom")
              ?.value || ""
          ).trim(),
          prenom: String(
            form.elements.namedItem("prenom")
              ?.value || ""
          ).trim(),
          email: String(
            form.elements.namedItem("email")
              ?.value || ""
          ).trim().toLowerCase(),
          motif: String(
            form.elements.namedItem("motif")
              ?.value || ""
          ).trim(),
          source: "mentions-legales"
        };
      }

      function validerDemandeJuridiquePage(
        payload
      ) {
        if (!payload.nom) {
          return "Votre nom est obligatoire.";
        }

        if (!payload.prenom) {
          return "Votre prénom est obligatoire.";
        }

        if (
          !payload.email ||
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            payload.email
          )
        ) {
          return (
            "Votre adresse e-mail n’est pas valide."
          );
        }

        if (!payload.motif) {
          return (
            "La raison de votre demande est obligatoire."
          );
        }

        return "";
      }

      async function envoyerDemandeJuridiquePage(
        payload
      ) {
        const endpoint = endpointEditingAdmin();

        if (!endpoint) {
          throw new Error(
            "Service de demande juridique non configuré."
          );
        }

        const response = await fetch(
          endpoint + "/public/demande-juridique",
          {
            method: "POST",
            credentials: "omit",
            cache: "no-store",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          }
        );

        const data = await response
          .json()
          .catch(() => null);

        if (
          !response.ok ||
          !data ||
          data.success !== true
        ) {
          throw new Error(
            data?.message ||
            data?.detail ||
            "La demande n’a pas pu être envoyée."
          );
        }

        return data;
      }

      async function demanderConfirmationDemandeJuridiquePage() {
        const slot = document.getElementById(
          "lcdp-lightbox-slot"
        );

        if (!slot) {
          throw new Error(
            "Slot de dialogue introuvable."
          );
        }

        const fragment = await chargerFragment(
          "/OBJET/BOX/02-box-dialogue-bouton.html"
        );
        const dialogue = fragment.querySelector(
          "[data-lcdp-box-dialogue-bouton]"
        );

        if (!dialogue) {
          throw new Error(
            "Objet dialogue incomplet."
          );
        }

        dialogue.querySelector(
          "[data-lcdp-dialogue-title]"
        ).textContent = "Envoyer la demande ?";

        dialogue.querySelector(
          "[data-lcdp-dialogue-text]"
        ).textContent =
          "Confirmez-vous l’envoi de votre demande juridique ?";

        const actions = dialogue.querySelector(
          "[data-lcdp-dialogue-actions]"
        );
        const fermer = dialogue.querySelector(
          "[data-lcdp-dialogue-close]"
        );

        const annuler =
          document.createElement("button");
        annuler.type = "button";
        annuler.className =
          "lcdp-button lcdp-button-secondary";
        annuler.textContent = "Annuler";

        const envoyer =
          document.createElement("button");
        envoyer.type = "button";
        envoyer.className =
          "lcdp-button lcdp-button-orange";
        envoyer.textContent =
          "Envoyer la demande";

        actions.appendChild(annuler);
        actions.appendChild(envoyer);
        slot.appendChild(fragment);

        return new Promise((resolve) => {
          let termine = false;

          function terminer(valeur) {
            if (termine) {
              return;
            }

            termine = true;
            document.removeEventListener(
              "keydown",
              gererClavier
            );
            dialogue.remove();
            resolve(valeur);
          }

          function gererClavier(event) {
            if (event.key === "Escape") {
              event.preventDefault();
              terminer(false);
            }
          }

          document.addEventListener(
            "keydown",
            gererClavier
          );

          fermer?.addEventListener(
            "click",
            () => terminer(false)
          );
          annuler.addEventListener(
            "click",
            () => terminer(false)
          );
          envoyer.addEventListener(
            "click",
            () => terminer(true)
          );
          dialogue.addEventListener(
            "click",
            (event) => {
              if (event.target === dialogue) {
                terminer(false);
              }
            }
          );
        });
      }

      async function afficherAlerteDemandeJuridiquePage(
        message,
        type
      ) {
        const slot = document.getElementById(
          "lcdp-lightbox-slot"
        );

        if (!slot) {
          throw new Error(
            "Slot d’alerte introuvable."
          );
        }

        const fragment = await chargerFragment(
          "/OBJET/BOX/02-box-alerte.html"
        );
        const alerte = fragment.querySelector(
          "[data-lcdp-box-alerte]"
        );

        if (!alerte) {
          throw new Error(
            "Objet alerte incomplet."
          );
        }

        alerte.dataset.type =
          type || "information";

        alerte.querySelector(
          "[data-lcdp-alerte-message]"
        ).textContent = String(message || "");

        const fermer = alerte.querySelector(
          "[data-lcdp-alerte-close]"
        );
        const ok = alerte.querySelector(
          "[data-lcdp-alerte-ok]"
        );

        slot.appendChild(fragment);

        return new Promise((resolve) => {
          let termine = false;

          function terminer() {
            if (termine) {
              return;
            }

            termine = true;
            document.removeEventListener(
              "keydown",
              gererClavier
            );
            alerte.remove();
            resolve();
          }

          function gererClavier(event) {
            if (event.key === "Escape") {
              event.preventDefault();
              terminer();
            }
          }

          document.addEventListener(
            "keydown",
            gererClavier
          );

          fermer?.addEventListener(
            "click",
            terminer
          );
          ok?.addEventListener(
            "click",
            terminer
          );
          alerte.addEventListener(
            "click",
            (event) => {
              if (event.target === alerte) {
                terminer();
              }
            }
          );
        });
      }

      function nettoyerHtmlAffichage(htmlBrut) {
        const moduleLegal =
          window.LCDP_DOCUMENTS_LEGAUX;

        if (
          !moduleLegal ||
          typeof moduleLegal.nettoyerHtml !== "function"
        ) {
          throw new Error(
            "Normaliseur des documents légaux indisponible."
          );
        }

        return moduleLegal.nettoyerHtml(htmlBrut);
      }

      function normaliserUrlLien(value) {
        const url = String(value || "").trim();

        if (!url || url.startsWith("//")) {
          return "";
        }

        const compact = url
          .replace(/[\u0000-\u0020\u007f]+/g, "")
          .toLowerCase();

        return (
          compact.startsWith("http://") ||
          compact.startsWith("https://") ||
          compact.startsWith("mailto:") ||
          compact.startsWith("tel:") ||
          compact.startsWith("/") ||
          compact.startsWith("#") ||
          compact.startsWith("../") ||
          compact.startsWith("./")
        )
          ? url
          : "";
      }

      function extraireTexteHtml(htmlBrut) {
        const template = document.createElement("template");
        template.innerHTML = String(htmlBrut || "");

        return String(
          template.content.textContent || ""
        ).replace(/\s+/g, " ").trim();
      }

      async function initialiserFooter() {
        const slot = document.getElementById("lcdp-footer-slot");
        slot.innerHTML = "";

        const footer = await chargerFragment("/OBJET/BOX/02-box-footer.html");
        slot.appendChild(footer);

        appliquerRoutesSite(slot);
      }

      async function initialiserPage() {
        appliquerRoutesSite(document);

        await initialiserBandeau();

        const documentMentions =
          await chargerMentionsLegales();

        await afficherMentionsLegales(
          documentMentions
        );

        await initialiserFooter();
      }

      initialiserPage().catch((erreur) => {
        console.error(erreur);
      });
    })();
  </script>
