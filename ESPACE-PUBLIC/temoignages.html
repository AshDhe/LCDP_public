<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c038 c032 c083 c036 c033 c037 c041 c040 c079">
<head>
  <meta charset="utf-8">
  <title>Témoignages - La Clé du Parc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Témoignages publiés par La Clé du Parc.">
  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css?v=20261117-verbatims-c079" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css?v=20261117-verbatims-c079">
  <script src="../config.js"></script>
  <script src="../OBJET/JSBASE/02-footer.js" data-lcdp-footer-autonome defer></script>
  <script src="./pages-listes-public.js" defer></script>
</head>
<body class="lcdp-app-page lcdp-typographie-editoriale-commune">
  <div id="lcdp-attente-arrivee" class="lcdp-attente-plein-ecran" role="status" aria-label="Chargement de la page" hidden>
    <div class="lcdp-loading-spinner" aria-hidden="true">
      <svg class="lcdp-loading-spinner__track" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></circle></svg>
      <svg class="lcdp-loading-spinner__arc" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="75"></circle></svg>
      <span class="lcdp-loading-spinner__dot"></span>
    </div>
  </div>
  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>
    <main class="lcdp-site-main" id="contenu-principal">
      <section class="lcdp-page-section" aria-labelledby="lcdp-page-titre">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content lcdp-stack-large lcdp-contenu-editorial">
            <header class="lcdp-editorial-page-heading">
              <h1 id="lcdp-page-titre" class="lcdp-title-page-center">Témoignages</h1>
            </header>
            <p id="lcdp-liste-etat" class="lcdp-text-muted lcdp-boxtext__text--center" role="status">Chargement…</p>
            <div id="lcdp-liste-publique" class="lcdp-cartouches-citation" aria-label="Témoignages"></div>
            <noscript><p>Activez JavaScript pour consulter cette page.</p></noscript>
          </div>
        </div>
      </section>
    </main>
    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>
  </div>
  <script>
    (async () => {
      "use strict";
      const liste = document.getElementById("lcdp-liste-publique");
      const etat = document.getElementById("lcdp-liste-etat");
      const roles = new Map([["membre", "Membre"], ["coach", "Coach"], ["parc", "Parc"]]);
      try {
        const endpoint = String(window.SITE_CONFIG?.workerEditingAdminUrl || "").replace(/\/+$/, "");
        if (!endpoint) throw new Error("API témoignages non configurée.");
        const reponse = await fetch(endpoint + "/public/temoignages", {
          method: "GET", credentials: "omit", cache: "no-store",
          headers: { Accept: "application/json" }
        });
        if (!reponse.ok) throw new Error("Témoignages indisponibles.");
        const data = await reponse.json();
        if (data?.success !== true || !Array.isArray(data.temoignages)) {
          throw new Error("Liste des témoignages invalide.");
        }
        const fragment = document.createDocumentFragment();
        for (const item of data.temoignages) {
          if (!item || !roles.has(item.auteur) ||
              typeof item.texte !== "string" || !item.texte.trim()) continue;
          const carte = document.createElement("blockquote");
          carte.className = "lcdp-cartouche-citation lcdp-cartouche-citation--" + item.auteur;
          const citation = document.createElement("p");
          citation.textContent = "« " + item.texte + " »";
          const signature = document.createElement("footer");
          signature.textContent = "— " + roles.get(item.auteur);
          carte.append(citation, signature);
          fragment.append(carte);
        }
        const contientTemoignages = fragment.childElementCount > 0;
        liste.replaceChildren(fragment);
        etat.textContent = contientTemoignages ? "" : "Aucun témoignage publié pour le moment.";
        etat.hidden = contientTemoignages;
      } catch (erreur) {
        console.error(erreur);
        etat.hidden = false;
        etat.textContent = "Le contenu est momentanément indisponible.";
      }
    })();
  </script>
</body>
</html>
