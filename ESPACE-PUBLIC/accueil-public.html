  <script>
  (() => {
    "use strict";
    const body = document.body;
    const actualites = document.getElementById("lcdp-actualite-bandeau");
    const debut = performance.now();
    let termine = false;
    let verificationEnCours = false;
    let delaiSecours;
    let observateur;

    // Même bandeau public que la page d'inscription, sans duplicata HTML.
    async function initialiserBandeauCommun() {
      const slot = document.getElementById("lcdp-bandeau-slot");
      const reponse = await fetch("./box-bandeau-nav-public.html", { cache: "no-cache" });
      if (!reponse.ok) throw new Error("Bandeau public indisponible.");
      const modele = document.createElement("template");
      modele.innerHTML = (await reponse.text()).trim();
      slot.replaceChildren(modele.content.cloneNode(true));
      if (typeof window.LCDP_initialiserMenuBurgerPublic !== "function") {
        throw new Error("Menu burger public indisponible.");
      }
      await window.LCDP_initialiserMenuBurgerPublic();
    }

    // Le footer de l'accueil utilise le meme fragment partage que les autres pages publiques.
    // Le footer historique reste visible en secours si le chargement echoue.
    async function initialiserFooterCommun() {
      const slot = document.getElementById("lcdp-footer-slot");
      if (!slot) return;
      const reponse = await fetch("/OBJET/HTMLBASE/02-footer.html", { cache: "no-cache" });
      if (!reponse.ok) throw new Error("Footer public indisponible.");
      const modele = document.createElement("template");
      modele.innerHTML = (await reponse.text()).trim();
      const fragment = modele.content.cloneNode(true);
      if (!fragment.querySelector(".lcdp-box-footer")) {
        throw new Error("Structure du footer public invalide.");
      }
      slot.replaceChildren(fragment);
      // Le fragment est inséré après DOMContentLoaded : réappliquer le lien canonique.
      window.LCDP_initialiserFooterMentionsLegales?.();
    }

    function actualitesChargees() {
      if (!actualites) return true;
      if (actualites.querySelector(".lcdp-actu-bandeau-placeholder")) return false;
      return !!actualites.querySelector(".lcdp-actu-bandeau-titre, .lcdp-actu-bandeau-texte, nav a");
    }

    function menuCharge() {
      const burger = document.querySelector("#lcdp-bandeau-slot [data-lcdp-burger-slot]");
      return Boolean(burger && burger.dataset.lcdpBurgerInitialise === "true");
    }

    function terminer() {
      if (termine) return;
      termine = true;
      if (observateur) observateur.disconnect();
      clearTimeout(delaiSecours);
      // Deux images rendues avec le nouveau contenu avant de retirer le voile.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        body.classList.remove("public-home--loading");
        const overlay = document.querySelector(".public-home__loading");
        if (overlay) overlay.remove();
      }));
    }

    function verifier() {
      if (termine || verificationEnCours) return;
      if (document.readyState === "loading") return;
      if (!actualitesChargees() || !menuCharge()) return;
      verificationEnCours = true;
      const polices = document.fonts?.ready || Promise.resolve();
      Promise.resolve(polices).catch(() => {}).then(() => terminer());
    }

    observateur = new MutationObserver(verifier);
    observateur.observe(document.querySelector(".public-home__app"), {
      subtree: true, childList: true, attributes: true,
      attributeFilter: ["class", "data-lcdp-burger-initialise"]
    });
    document.addEventListener("DOMContentLoaded", () => {
      initialiserBandeauCommun().catch(console.error);
      initialiserFooterCommun().catch(console.error);
      verifier();
    }, { once: true });
    window.addEventListener("load", verifier, { once: true });
    delaiSecours = setTimeout(terminer, 7000);
    verifier();
  })();
  </script>
