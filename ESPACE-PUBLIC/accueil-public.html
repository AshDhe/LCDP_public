<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Accueil public - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accueil public La Clé du Parc. Accès rapide aux fonctions membre.">

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="../OBJET/CSSBASE/cssbase.css" data-site-href="/OBJET/CSSBASE/cssbase.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-bandeau-nav.css" data-site-href="/OBJET/BOX/02-box-bandeau-nav.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-menu-burger.css" data-site-href="/OBJET/BOX/02-box-menu-burger.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-alerte.css" data-site-href="/OBJET/BOX/02-box-alerte.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-dialogue-bouton.css" data-site-href="/OBJET/BOX/02-box-dialogue-bouton.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-footer.css" data-site-href="/OBJET/BOX/02-box-footer.css">

  <link rel="stylesheet" href="../OBJET/BOX/01-box-text.css">
  <script>
    // Charger le même objet CSS que l'accueil membre, via l'URL OBJET configurée.
    (() => {
      const config = window.SITE_CONFIG || {};
      const publicBase = String(config.publicBaseUrl || config.PUBLIC_BASE || "").replace(/\/+$/, "");
      const objetBase = String(config.objetBaseUrl || config.OBJET_BASE || publicBase + "/OBJET").replace(/\/+$/, "");
      const href = typeof config.objetUrl === "function"
        ? config.objetUrl("/BOX/01-box-actualite.css")
        : objetBase + "/BOX/01-box-actualite.css";
      document.write('<link rel="stylesheet" href="' + href + '">');
    })();
  </script>
  <link rel="stylesheet" href="../OBJET/BOX/03-box-formulaire.css">
  <link rel="stylesheet" href="../OBJET/BOX/01-box-carrousel.css">
  <link rel="stylesheet" href="../OBJET/BOX/02-box-contact.css">
  <!-- Ajustements propres à l’accueil public, uniquement sur mobile : -30 % sur les espacements verticaux. -->
  <style id="lcdp-correction-espacements-public">
    @media (max-width: 767px) {
      .lcdp-page-accueil-public .lcdp-site-main > .lcdp-page-section.lcdp-accueil-section {
        padding-top: calc(var(--lcdp-space-5, 36px) * 0.42 * 0.7 * 3 * 0.85);
      }
      .lcdp-page-accueil-public .lcdp-accueil-content {
        gap: calc(var(--lcdp-space-4, 24px) * 0.7);
      }
    }
    @media (min-width: 768px) {
      .lcdp-page-accueil-public .lcdp-site-main > .lcdp-page-section.lcdp-accueil-section {
        padding-top: calc(var(--lcdp-space-4, 24px) * 2);
      }
    }
  </style>
  <style id="lcdp-pictos-accueil-public">
    .lcdp-page-accueil-public #lcdp-menu-central-slot,
    .lcdp-page-accueil-public #lcdp-menu-central-slot > *,
    .lcdp-page-accueil-public #lcdp-menu-central-slot .lcdp-accueil-actions {
      width: 100%;
      min-width: 0;
    }

    .lcdp-page-accueil-public .lcdp-accueil-actions > button.lcdp-accueil-picto {
      box-sizing: border-box;
      width: 148.68px;
      max-width: 100%;
      flex-shrink: 0;
      height: 112px;
      min-height: 112px;
      margin-inline: auto;
      padding: 8px 16px;
      flex-direction: column;
      gap: 4px;
      color: #ffffff;
    }
    .lcdp-accueil-picto > svg,
    .lcdp-accueil-picto > img {
      display: block;
      max-width: none;
      min-width: 71.68px;
      width: 71.68px;
      height: 71.68px;
      flex: 0 0 71.68px;
      object-fit: contain;
    }
    .lcdp-accueil-picto > img {
      filter: brightness(0) invert(1);
      transform: scale(1.15);
    }
    .lcdp-accueil-picto > span {
      font-size: clamp(11.95488px, 3.6064vw, 16.4864px);
      transform: scaleX(0.95);
      line-height: 1.05;
      white-space: nowrap;
    }
    @media (min-width: 768px) {
      .lcdp-page-accueil-public .lcdp-accueil-actions > button.lcdp-accueil-picto {
        width: 194.88px;
        height: 120px;
        min-height: 120px;
      }
      .lcdp-accueil-picto > svg,
      .lcdp-accueil-picto > img {
        min-width: 76.16px;
        width: 76.16px;
        height: 76.16px;
        flex-basis: 76.16px;
      }
      .lcdp-accueil-picto > span {
        font-size: 15.088px;
      }
    }
  </style>
  <style>
    .lcdp-page-accueil-public .lcdp-accueil-main { flex-direction: column; }
    #le-club { width: 100%; flex: 0 0 auto; }
    #le-club[hidden] { display: none !important; }
  </style>
</head>

<body class="lcdp-page-accueil-public">
  <div class="lcdp-site-page">

    <div id="lcdp-bandeau-slot"></div>
    <div id="lcdp-actualite-bandeau">
      <div class="lcdp-page-container">
        <div class="lcdp-page-content">
          <!-- Réserver deux lignes avant le chargement des actualités. -->
          <div class="lcdp-boxtext__text--center lcdp-actu-bandeau-placeholder" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <main class="lcdp-site-main lcdp-accueil-main">
      <section class="lcdp-page-section lcdp-accueil-section">
        <div class="lcdp-page-container lcdp-accueil-container">
          <div class="lcdp-page-content lcdp-accueil-content">

            <div id="lcdp-menu-central-slot"></div>

          </div>
        </div>
      </section>
      <section id="le-club" hidden aria-label="Le club"></section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>
  <script src="./controle-acces-accueil.js"></script>
  <script src="./accueil-public.js"></script>
  <script src="./actualite.js" defer></script>
  <script src="./club-accueil.js" defer></script>
</body>
</html>
