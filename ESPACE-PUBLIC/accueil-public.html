<!DOCTYPE html>
<html lang="fr" data-lcdp-css="c085">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Clé du Parc - Accueil Vertical</title>
  <link rel="stylesheet" href="/lcdp-central-mobile-first.css">
</head>
<body class="public-home">
  <div class="public-home__app">
    <!-- HEADER -->
    <header class="public-home__header">
      <div class="public-home__brand">
        <div class="public-home__brand-icon">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
          </svg>
        </div>
        <div>
          <h1 class="public-home__brand-name">La Clé du Parc</h1>
          <span class="public-home__brand-subtitle">Espace public</span>
        </div>
      </div>
      <button class="public-home__menu-button" type="button" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- CONTENU -->
    <main class="public-home__main">
      <div class="public-home__intro">
        <button class="public-home__more" type="button">
          <span>En savoir plus</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
        <h2 class="public-home__heading">Des parcs</h2>
      </div>

      <div class="public-home__actions">
        <button class="public-home__action public-home__action--plan" type="button">
          <span class="public-home__action-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </span>
          <span class="public-home__action-label">Planifier</span>
        </button>

        <button class="public-home__action public-home__action--access" type="button">
          <span class="public-home__action-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          </span>
          <span class="public-home__action-label">Mes accès</span>
        </button>

        <button class="public-home__action public-home__action--key" type="button">
          <span class="public-home__action-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
            </svg>
          </span>
          <span class="public-home__action-label">Ma clé</span>
        </button>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="public-home__footer">
      <a href="#">Mentions légales</a>
      <span class="public-home__footer-separator" aria-hidden="true">•</span>
      <a href="#">Données</a>
      <span class="public-home__footer-separator" aria-hidden="true">•</span>
      <a href="#">Vérification</a>
    </footer>
  </div>
</body>
</html>
