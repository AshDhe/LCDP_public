<!DOCTYPE html>
<html lang="fr" data-lcdp-css="c085 c029 c038">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Clé du Parc - Accueil Vertical</title>
  <link rel="stylesheet" href="/OBJET/CSSBASE/lcdp-central-mobile-first.css">
  <script src="../config.js"></script>
  <script src="/OBJET/BOX/02-box-footer.js" defer></script>
  <script src="./actualite.js" defer></script>
  <script src="./box-menu-burger-public.js" defer></script>
</head>
<body class="public-home">
  <div class="public-home__app">
    <!-- HEADER -->
    <header class="public-home__header">
      <div class="public-home__brand">
        <div class="public-home__brand-icon">
          <img src="./logo-bandeau-96.webp" alt="" width="36" height="36" decoding="async">
        </div>
        <div>
          <h1 class="public-home__brand-name">La Clé du Parc</h1>
          <span class="public-home__brand-subtitle">Espace public</span>
        </div>
      </div>
      <div data-lcdp-burger-slot></div>
    </header>

    <!-- CONTENU -->
    <main class="public-home__main">
      <!-- Bandeau d'actualité historique : alimenté par actualite.js -->
      <div id="lcdp-actualite-bandeau" class="public-home__actualite">
        <div class="lcdp-page-container">
          <div class="lcdp-page-content">
            <div class="lcdp-boxtext__text--center lcdp-actu-bandeau-placeholder" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <div class="public-home__actions">
        <button class="public-home__action public-home__action--plan" type="button">
          <span class="public-home__action-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </span>
          <span class="public-home__action-label">Planifier</span>
        </button>

        <button class="public-home__action public-home__action--access" type="button">
          <span class="public-home__action-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          </span>
          <span class="public-home__action-label">Mes accès</span>
        </button>

        <button class="public-home__action public-home__action--key" type="button">
          <span class="public-home__action-icon">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
            </svg>
          </span>
          <span class="public-home__action-label">Ma clé</span>
        </button>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="public-home__footer" data-lcdp-box-footer>
      <a href="/ESPACE-PUBLIC/mentions-legales.html"
         data-site-href="/ESPACE-PUBLIC/mentions-legales.html"
         data-lcdp-footer-mentions-legales>Mentions légales - Données</a>
      <span class="public-home__footer-separator" aria-hidden="true">•</span>
      <button type="button" popovertarget="lcdp-footer-verification-info">Vérification</button>
      <div id="lcdp-footer-verification-info" class="public-home__verification-info"
           popover="auto" role="dialog" aria-label="Vérification">
        <button type="button" class="public-home__verification-close"
                popovertarget="lcdp-footer-verification-info"
                popovertargetaction="hide" aria-label="Fermer">×</button>
        <div data-verification-slot
             data-verification-url="https://script.google.com/macros/s/AKfycbz4PBr97qQBPrXcBc8jGE5560b3LBhmEwGXBw5H3YIqiGvExilaUK-ORCLK3NV2hZu3xA/exec"></div>
      </div>
    </footer>
  </div>
</body>
</html>
