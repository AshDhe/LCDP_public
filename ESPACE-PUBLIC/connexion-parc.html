<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c033 c037 c041 c040 c036 c038">
<head>
  <meta charset="utf-8">

  <title>Connexion parc - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Connexion à votre compte parc La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css">
</head>

<body class="lcdp-connexion-parc lcdp-app-page lcdp-app-page--role lcdp-app-page--role-parc">
  <div class="lcdp-site-page lcdp-app-wrapper">

    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section
        class="lcdp-page-section"
        aria-label="Connexion au compte parc"
      >
        <div class="lcdp-page-container">

          <section
            class="lcdp-component lcdp-box-formulaire-page lcdp-box-formulaire-page--compact"
            data-lcdp-box-formulaire-page
          >
            <div class="lcdp-box-formulaire-page__inner">

              <form
                id="formulaire-connexion-parc"
                method="post"
                class="lcdp-box-formulaire"
                novalidate
              >
                <header class="lcdp-box-formulaire__header">
                  <h1 class="lcdp-box-formulaire__title">
                    Connexion parc
                  </h1>

                  <p class="lcdp-box-formulaire__subtitle">
                    Accédez à votre compte parc
                  </p>
                </header>

                <div class="lcdp-box-formulaire__fields">

                  <div class="lcdp-box-champ-formulaire">
                    <div class="lcdp-box-champ-formulaire__control">
                      <input
                        type="email"
                        id="emailparc"
                        name="emailparc"
                        aria-label="Identifiant e-mail de votre compte parc"
                        placeholder="Identifiant e-mail de votre compte parc"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                      >
                    </div>
                  </div>

                  <div class="lcdp-box-champ-formulaire">
                    <div class="lcdp-box-champ-formulaire__control">
                      <input
                        type="password"
                        id="mdpparc"
                        name="mdpparc"
                        aria-label="Mot de passe de votre compte parc"
                        placeholder="Mot de passe de votre compte parc"
                        autocomplete="current-password"
                        required
                      >
                    </div>
                  </div>

                </div>

                <div class="lcdp-box-formulaire__options">
                  <label
                    class="lcdp-box-champ-formulaire__checkbox-line"
                    for="afficher-mdp-parc"
                  >
                    <input
                      type="checkbox"
                      id="afficher-mdp-parc"
                    >
                    <span>Afficher le mot de passe</span>
                  </label>
                  <a
                    class="lcdp-box-formulaire__password-recovery"
                    id="lien-mot-de-passe-oublie"
                    href="./mdp-perdu-parc.html"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Mot de passe perdu ?
                  </a>
                </div>

                <div class="lcdp-box-formulaire__actions">
                  <button
                    type="submit"
                    id="bouton-valider-formulaire"
                    class="lcdp-button"
                    aria-label="Connexion"
                    title="Connexion"
                  >
                    Connexion
                  </button>
                </div>

              </form>

            </div>
          </section>

        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script>
    (() => {
      "use strict";

      const siteBase = (
        window.SITE_BASE ||
        window.SITE_CONFIG?.publicBaseUrl ||
        window.SITE_CONFIG?.siteBase ||
        ""
      ).replace(/\/$/, "");

      function construireUrlSite(chemin) {
        if (!chemin) return chemin;
        if (
          chemin.startsWith("#") ||
          chemin.startsWith("mailto:") ||
          chemin.startsWith("tel:") ||
          chemin.startsWith("http://") ||
          chemin.startsWith("https://") ||
          chemin.startsWith("data:")
        ) {
          return chemin;
        }
        if (siteBase) {
          return chemin.startsWith("/")
            ? siteBase + chemin
            : siteBase + "/" + chemin.replace(/^\.\//, "");
        }
        return chemin.startsWith("/") ? ".." + chemin : chemin;
      }

      window.LCDP_construireUrlSite = construireUrlSite;

      function appliquerRoutesSite(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          element.setAttribute("href", construireUrlSite(element.dataset.siteHref));
        });
        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          element.setAttribute("src", construireUrlSite(element.dataset.siteSrc));
        });
      }

      async function chargerFragment(chemin) {
        const reponse = await fetch(construireUrlSite(chemin), {
          method: "GET",
          credentials: "same-origin",
          cache: "no-cache"
        });
        if (!reponse.ok) throw new Error("Fragment introuvable : " + chemin);
        const html = await reponse.text();
        const template = document.createElement("template");
        template.innerHTML = html.trim();
        return template.content.cloneNode(true);
      }

      function chargerScriptUneFois(chemin) {
        const src = construireUrlSite(chemin);
        if (document.querySelector(`script[data-lcdp-script="${chemin}"]`)) {
          return Promise.resolve();
        }
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.dataset.lcdpScript = chemin;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Script introuvable : " + chemin));
          document.body.appendChild(script);
        });
      }

      async function initialiserBandeauPublic() {
        const slot = document.getElementById("lcdp-bandeau-slot");
        if (!slot) return;
        slot.innerHTML = "";
        const bandeau = await chargerFragment("/ESPACE-PUBLIC/box-bandeau-nav-public.html");
        slot.appendChild(bandeau);
        appliquerRoutesSite(slot);
        await chargerScriptUneFois("/ESPACE-PUBLIC/box-menu-burger-public.js");
        if (typeof window.LCDP_initialiserMenuBurgerPublic === "function") {
          await window.LCDP_initialiserMenuBurgerPublic();
        }
      }

      async function initialiserFooterPublic() {
        const slot = document.getElementById("lcdp-footer-slot");
        if (!slot) return;
        const footer = await chargerFragment("/OBJET/BOX/02-box-footer.html");
        slot.appendChild(footer);
        appliquerRoutesSite(slot);
      }

      appliquerRoutesSite(document);
      initialiserBandeauPublic()
        .then(initialiserFooterPublic)
        .catch((erreur) => { console.error(erreur); });
    })();
  </script>
  <script>
    document.getElementById('formulaire-connexion-parc')?.addEventListener('submit',function(event){
      if(this.dataset.connexionInitialisee!=='true'){
        event.preventDefault();
        window.alert('Le service de connexion n’a pas été chargé. Rechargez cette page.');
      }
    });
  </script>
  <script src="./connexion-parc.js"></script>
</body>
</html>
