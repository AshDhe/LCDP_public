<!doctype html><html lang="fr" data-lcdp-css="c085 c034 c033 c037 c041 c040 c036 c038"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe perdu parc - La Clé du Parc</title><script src="../config.js"></script><link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css"><style>
/* Alignement du bouton de confirmation dans les trois pages Mot de passe perdu. */
#mdp-perdu .lcdp-box-formulaire__actions { align-items: center; }
</style></head><body class="lcdp-app-page lcdp-app-page--role lcdp-app-page--role-parc"><div class="lcdp-site-page lcdp-app-wrapper"><div id="lcdp-bandeau-slot"></div><main class="lcdp-site-main"><section class="lcdp-page-section"><div class="lcdp-page-container"><div class="lcdp-box-formulaire-page lcdp-box-formulaire-page--compact"><div class="lcdp-box-formulaire-page__inner"><form class="lcdp-box-formulaire" id="mdp-perdu"><header class="lcdp-box-formulaire__header"><h1 class="lcdp-box-formulaire__title">Mot de passe perdu</h1><p class="lcdp-box-formulaire__subtitle">Renseignez l'e-mail de votre compte PARC La Clé du Parc.</p></header><div class="lcdp-box-formulaire__fields"><div class="lcdp-box-champ-formulaire"><div class="lcdp-box-champ-formulaire__control"><input type="email" name="email" id="email" placeholder="E-mail de votre compte PARC" autocomplete="email" required></div></div></div><div class="lcdp-box-formulaire__actions"><button class="lcdp-button lcdp-button-primary" type="submit" id="envoyer">Envoyer</button></div><p id="statut" class="lcdp-box-formulaire__note" role="status"></p></form></div></div></div></section></main><div id="lcdp-footer-slot"></div><div id="lcdp-lightbox-slot"></div></div>
<script>
  (() => {
    "use strict";
    const siteBase = (window.SITE_BASE || window.SITE_CONFIG?.publicBaseUrl || window.SITE_CONFIG?.siteBase || "").replace(/\/$/, "");

    function urlSite(chemin) {
      if (/^(?:https?:|mailto:|tel:|data:|#)/.test(chemin)) return chemin;
      if (siteBase) return siteBase + (chemin.startsWith("/") ? chemin : "/" + chemin.replace(/^\.\//, ""));
      return chemin.startsWith("/") ? ".." + chemin : chemin;
    }
    function adapterLiens(racine) {
      racine.querySelectorAll("[data-site-href]").forEach(el => el.setAttribute("href", urlSite(el.dataset.siteHref)));
      racine.querySelectorAll("[data-site-src]").forEach(el => el.setAttribute("src", urlSite(el.dataset.siteSrc)));
    }
    async function chargerFragment(chemin, cible) {
      const reponse = await fetch(urlSite(chemin), {method:"GET",credentials:"same-origin",cache:"no-cache"});
      if (!reponse.ok) throw new Error("Fragment introuvable : " + chemin);
      const template = document.createElement("template");
      template.innerHTML = (await reponse.text()).trim();
      cible.replaceChildren(template.content.cloneNode(true));
      adapterLiens(cible);
    }
    function chargerScriptMenu() {
      const chemin="/ESPACE-PUBLIC/box-menu-burger-public.js";
      if (document.querySelector(`script[data-lcdp-script="${chemin}"]`)) return Promise.resolve();
      return new Promise((resolve,reject) => {
        const script=document.createElement("script");
        script.src=urlSite(chemin);
        script.defer=true;
        script.dataset.lcdpScript=chemin;
        script.onload=resolve;
        script.onerror=() => reject(new Error("Script introuvable : " + chemin));
        document.body.appendChild(script);
      });
    }
    window.SITE_BASE = siteBase;
    window.LCDP_construireUrlSite = urlSite;
    adapterLiens(document);
    const bandeau=document.getElementById("lcdp-bandeau-slot");
    if (bandeau) {
      chargerFragment("/ESPACE-PUBLIC/box-bandeau-nav-public.html", bandeau)
        .then(chargerScriptMenu)
        .then(() => window.LCDP_initialiserMenuBurgerPublic?.())
        .catch(error => console.error("Bandeau public indisponible",error));
    }
    const footer=document.getElementById("lcdp-footer-slot");
    if (footer) {
      chargerFragment("/OBJET/HTMLBASE/02-footer.html", footer)
        .catch(error => console.error("Pied de page indisponible",error));
    }
  })();
</script>
<script src="./mdp-perdu-parc.js"></script></body></html>
