<!doctype html>
<html lang="fr" data-lcdp-css="c085 c034 c033 c037 c041 c040 c036 c038">
<head>
  <meta charset="utf-8">

  <title>Mot de passe perdu membre - La Clé du Parc</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recevoir un lien pour définir ou redéfinir votre mot de passe membre La Clé du Parc.">

  <script src="../config.js"></script>

  <script>
    window.SITE_BASE =
      window.SITE_CONFIG?.publicBaseUrl ||
      window.SITE_CONFIG?.siteBase ||
      "";
  </script>

  <link rel="stylesheet" href="../OBJET/CSSBASE/lcdp-central-mobile-first.css" data-site-href="/OBJET/CSSBASE/lcdp-central-mobile-first.css">
  <style>
    /* Aligner l’action sur l’axe du formulaire, y compris sur grand écran. */
    #formulaire-mdp-perdu-membre .lcdp-box-formulaire__actions {
      align-items: center;
    }
  </style>
</head>

<body class="lcdp-app-page">
  <div class="lcdp-site-page lcdp-app-wrapper">
    <div id="lcdp-bandeau-slot"></div>

    <main class="lcdp-site-main">
      <section
        class="lcdp-page-section"
        aria-label="Mot de passe perdu membre"
      >
        <div class="lcdp-page-container">

          <div class="lcdp-box-formulaire-page lcdp-box-formulaire-page--compact">
            <div class="lcdp-box-formulaire-page__inner">

              <form
                id="formulaire-mdp-perdu-membre"
                class="lcdp-box-formulaire"
                novalidate
              >
                <header class="lcdp-box-formulaire__header">
                  <h1 class="lcdp-box-formulaire__title">
                    Mot de passe perdu
                  </h1>

                  <p class="lcdp-box-formulaire__subtitle">
                    Renseignez l'e-mail de votre compte membre La Clé du Parc
                  </p>
                  <p class="lcdp-box-formulaire__note lcdp-box-formulaire__note--intro-center">
                    Vous recevrez le lien de création / mise à jour de votre mot de passe membre.
                  </p>
                </header>

                <div class="lcdp-box-formulaire__fields">
                  <div class="lcdp-box-champ-formulaire">

                    <div class="lcdp-box-champ-formulaire__control">
                      <input
                        type="email"
                        id="emailmembre"
                        name="emailmembre"
                        placeholder="E-mail de votre compte membre"
                        autocomplete="email"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                      >
                    </div>
                  </div>
                </div>

                <div class="lcdp-box-formulaire__actions">
                  <button
                    type="submit"
                    id="bouton-valider-formulaire"
                    class="lcdp-button lcdp-button-primary"
                  >
                    Envoyer
                  </button>
                </div>
              </form>

            </div>
          </div>

        </div>
      </section>
    </main>

    <div id="lcdp-footer-slot"></div>
    <div id="lcdp-lightbox-slot"></div>

  </div>

  <script>
    (() => {
      "use strict";

      const siteBase = (
        window.SITE_BASE ||
        window.SITE_CONFIG?.publicBaseUrl ||
        window.SITE_CONFIG?.siteBase ||
        ""
      ).replace(/\/$/, "");

      function construireUrlSite(chemin) {
        if (!chemin) return chemin;

        if (
          chemin.startsWith("#") ||
          chemin.startsWith("mailto:") ||
          chemin.startsWith("tel:") ||
          chemin.startsWith("http://") ||
          chemin.startsWith("https://") ||
          chemin.startsWith("data:")
        ) {
          return chemin;
        }

        if (siteBase) {
          return chemin.startsWith("/")
            ? siteBase + chemin
            : siteBase + "/" + chemin.replace(/^\.\//, "");
        }

        return chemin.startsWith("/") ? ".." + chemin : chemin;
      }

      function appliquerRoutesSite(racine = document) {
        racine.querySelectorAll("[data-site-href]").forEach((element) => {
          element.setAttribute("href", construireUrlSite(element.dataset.siteHref));
        });

        racine.querySelectorAll("[data-site-src]").forEach((element) => {
          element.setAttribute("src", construireUrlSite(element.dataset.siteSrc));
        });
      }

      window.LCDP_construireUrlSite = construireUrlSite;
      appliquerRoutesSite(document);
    })();
  </script>
  
<script>
  (() => {
    "use strict";
    const siteBase = (window.SITE_BASE || window.SITE_CONFIG?.publicBaseUrl || window.SITE_CONFIG?.siteBase || "").replace(/\/$/, "");

    function urlSite(chemin) {
      if (/^(?:https?:|mailto:|tel:|data:|#)/.test(chemin)) return chemin;
      if (siteBase) return siteBase + (chemin.startsWith("/") ? chemin : "/" + chemin.replace(/^\.\//, ""));
      return chemin.startsWith("/") ? ".." + chemin : chemin;
    }
    function adapterLiens(racine) {
      racine.querySelectorAll("[data-site-href]").forEach(el => el.setAttribute("href", urlSite(el.dataset.siteHref)));
      racine.querySelectorAll("[data-site-src]").forEach(el => el.setAttribute("src", urlSite(el.dataset.siteSrc)));
    }
    async function chargerFragment(chemin, cible) {
      const reponse = await fetch(urlSite(chemin), {method:"GET",credentials:"same-origin",cache:"no-cache"});
      if (!reponse.ok) throw new Error("Fragment introuvable : " + chemin);
      const template = document.createElement("template");
      template.innerHTML = (await reponse.text()).trim();
      cible.replaceChildren(template.content.cloneNode(true));
      adapterLiens(cible);
    }
    function chargerScriptMenu() {
      const chemin="/ESPACE-PUBLIC/box-menu-burger-public.js";
      if (document.querySelector(`script[data-lcdp-script="${chemin}"]`)) return Promise.resolve();
      return new Promise((resolve,reject) => {
        const script=document.createElement("script");
        script.src=urlSite(chemin);
        script.defer=true;
        script.dataset.lcdpScript=chemin;
        script.onload=resolve;
        script.onerror=() => reject(new Error("Script introuvable : " + chemin));
        document.body.appendChild(script);
      });
    }
    window.SITE_BASE = siteBase;
    window.LCDP_construireUrlSite = urlSite;
    adapterLiens(document);
    const bandeau=document.getElementById("lcdp-bandeau-slot");
    if (bandeau) {
      chargerFragment("/ESPACE-PUBLIC/box-bandeau-nav-public.html", bandeau)
        .then(chargerScriptMenu)
        .then(() => window.LCDP_initialiserMenuBurgerPublic?.())
        .catch(error => console.error("Bandeau public indisponible",error));
    }
    const footer=document.getElementById("lcdp-footer-slot");
    if (footer) {
      chargerFragment("/OBJET/BOX/02-box-footer.html", footer)
        .catch(error => console.error("Pied de page indisponible",error));
    }
  })();
</script>
<script src="./mdp-perdu-membre.js"></script>
</body>
</html>
